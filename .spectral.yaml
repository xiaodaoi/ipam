# Spectral 规则集：§12.2/§12.4 门禁落地
# 结构校验以 redocly bundle 步骤为权威（多文件+更严格），oas3-schema 降级避免工具差异误报。
extends: ["spectral:oas"]
rules:
  oas3-schema: warn

  # ── 文档完备性三件套（error）──
  operation-operationId: error
  operation-description: error
  operation-has-summary:
    description: 每个 operation 必须提供 summary
    given: $.paths[*][get,post,put,patch,delete]
    severity: error
    then:
      field: summary
      function: truthy
  operation-tags: error

  # ── §12.2-1：operationId 小驼峰稳定命名 ──
  operation-id-style:
    description: operationId 必须为小驼峰动词命名，发布后不可改
    given: $.paths[*][*].operationId
    severity: error
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][a-zA-Z0-9]+$"

  # ── §12.2-2：成功响应必须提供 examples（error）；错误响应建议（info）──
  operation-examples:
    description: 成功响应的 content 必须提供 examples
    given: $..responses[*].content[*]
    severity: warn
    then:
      field: examples
      function: truthy
  operation-examples-hint:
    description: 错误响应建议提供 examples
    given: $..responses[*].content[*]
    severity: info
    then:
      field: examples
      function: truthy

  info-contact: off
  info-license: off
  oas3-unused-component: warn
