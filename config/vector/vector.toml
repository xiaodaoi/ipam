# Vector 日志采集链路（§6：Kea/Unbound → VRL 归一化 → ClickHouse logs 表）
# 关联键：client_mac 统一 12 位小写 hex（去冒号/短横线）；批量 5MB/5s 刷盘（FR-E-02）
# 版本契约：0.4x 语法——fallible 函数须 err 解构或 `!`；if/else 分支必须是块 { }

data_dir = "/var/lib/vector"

[sources.kea_stdout]
type = "file"
include = ["/var/log/kea/*.log"]
# 只读启动后的新日志：避免 Vector 重建/丢 checkpoint 时整文件重放造成日志洪峰（M6-008 事故）
# 首次部署若需回填历史，可临时改为 "beginning" 并在完成后改回 "end"。
read_from = "end"

[sources.unbound_log]
type = "file"
include = ["/var/log/unbound/unbound.log"]
read_from = "end"

# ── Kea DHCPv4 租约/分配日志解析（Kea 2.2 行格式：TS LEVEL [组件/pid] DHCP4.EVENT ...）──
[transforms.parse_kea]
type = "remap"
inputs = ["kea_stdout"]
source = '''
  m, merr = parse_regex(.message, r'^(?P<ts>\S+ \S+)\s+(?P<level>\w+)\s+\[[^\]]+\]\s+DHCP(?P<fam>[46])_(?P<event>[A-Z0-9_]+)\s+(?P<rest>.*)$')
  if merr != null {
    abort
  }
  .timestamp, terr = parse_timestamp(m.ts, format: "%Y-%m-%d %H:%M:%S.%f")
  if terr != null {
    .timestamp = now()
  }
  .severity = m.level
  .event = m.event
  .client_mac = ""
  .address = ""
  if m.fam == "4" {
    mac_m, mac_err = parse_regex(m.rest, r'(?:hwaddr=|\[hwtype=\d+\s+)(?P<mac>[0-9a-fA-F:]{17})')
    if mac_err == null && mac_m != null {
      m1, e1 = replace(mac_m.mac, ":", "")
      m2 = replace(m1, "-", "")
      if e1 == null {
        .client_mac = downcase!(m2)
      }
    }
    ip_m, ip_err = parse_regex(m.rest, r'(?:\blease\s+|assigned\s+|address=)(?P<ip>\d+\.\d+\.\d+\.\d+)')
    if ip_err == null && ip_m != null {
      .address = ip_m.ip
    }
  } else {
    duid_m, duid_err = parse_regex(m.rest, r'duid=\[(?P<duid>[0-9a-fA-F:]+)\]')
    if duid_err == null && duid_m != null {
      d1, d1e = replace(duid_m.duid, ":", "")
      if d1e == null {
        .client_mac = downcase!(d1)
      }
    }
    ip6_m, ip6_err = parse_regex(m.rest, r'(?:\blease\s+for\s+address\s+|assigned\s+|address=)(?P<ip>[0-9a-fA-F:]+)')
    if ip6_err == null && ip6_m != null {
      .address = ip6_m.ip
    }
  }
  .domain = ""
  .rtype = "dhcp"
'''

# ── Unbound 查询日志解析（verbosity 需 ≥1 且 log-queries）──
# 应答事件来自 parse_dns_log（python 模块 DNS_LOG，含 answer_ip）
[transforms.parse_unbound]
type = "remap"
inputs = ["unbound_log"]
source = '''
  # 查询行：`info: srcip qname qtype IN`（log-queries）；其余行（含 DNS_LOG）丢弃
  m, merr = parse_regex(.message, r'\[(?P<ts>\d+)\] unbound\[\d+:\d+\] info: (?P<srcip>(?:\d{1,3}\.){3}\d{1,3}|[0-9a-fA-F:]+) (?P<qname>\S+) (?P<qtype>\S+) IN$')
  if merr != null {
    abort
  }
  .event = "dns_query"
  .rcode = ""
  .answer_ip = null
  .timestamp = from_unix_timestamp!(to_int!(m.ts), unit: "seconds")
  .severity = "INFO"
  .client_mac = ""
  .address = ""
  .sip = m.srcip
  .domain = m.qname
  .qtype = m.qtype
  .rtype = "dns"
'''

# ── Unbound Python 模块结构化日志（DNS_LOG JSON）──
# dns_log.py 在 MODULE_EVENT_MODDONE 时输出 JSON，包含完整应答区 IP
[transforms.parse_dns_log]
type = "remap"
inputs = ["unbound_log"]
source = '''
  m, merr = parse_regex(.message, r'DNS_LOG (?P<json>\{.*\})\s*$')
  if merr != null {
    abort
  }
  parsed, perr = parse_json(m.json)
  if perr != null {
    abort
  }
  .event = "resolve"
  .rcode = parsed.rcode
  .answer_ip = parsed.answer_ip
  .severity = "INFO"
  .client_mac = ""
  .address = ""
  .sip = parsed.client_ip
  .domain = parsed.qname
  .qtype = parsed.qtype
  .rtype = "dns"
  # DNS_LOG 自带 epoch 秒（可带小数）；不能再用 now()，否则重放会把历史日志记成当前时间
  .timestamp = from_unix_timestamp!(to_int!(parsed.ts), unit: "seconds")
'''

# ── 归一化统一 schema（logs 宽表字段，§3 ClickHouse）──
# 空地址必须落 null（列 Nullable(IPv6)，'' 无法解析会整批失败）；
# ts 用毫秒字符串保游标精度。
[transforms.normalize]
type = "remap"
inputs = ["parse_kea", "parse_unbound", "parse_dns_log"]
source = '''
  if .rtype != "dhcp" && .rtype != "dns" {
    abort
  }
  # IPv6 链路本地地址常携带 zone 后缀（如 fe80::13ee:ace7:ccb7:97fc%ens160），
  # ClickHouse IPv6 解析会整批失败（错误 632 UNEXPECTED_DATA_AFTER_PARSED_VALUE）→ 入库前剥离 %zone。
  ip_v = null
  if .address != null && .address != "" {
    ip_s, ip_e = replace(.address, r'%[^%]*$', "")
    if ip_e == null {
      ip_v = ip_s
    }
  }
  mac_v = if .client_mac == "" { "" } else { downcase!(.client_mac) }
  sip_v = null
  if .sip != null && .sip != "" {
    sip_s, sip_e = replace(.sip, r'%[^%]*$', "")
    if sip_e == null {
      sip_v = sip_s
    }
  }
  # DHCP 行无 rcode（undefined→null），CH rcode 为非空列必须落空串
  rcode_v = ""
  if .rcode != null {
    rcode_v = .rcode
  }
  answer_v = null
  if .answer_ip != null && .answer_ip != "" {
    ans_s, ans_e = replace(.answer_ip, r'%[^%]*$', "")
    if ans_e == null {
      answer_v = ans_s
    }
  }
  . = {
    "ts": format_timestamp!(.timestamp, "%F %T%.3f"),
    "type": .rtype,
    "severity": .severity,
    "client_mac": mac_v,
    "client_ip": ip_v,
    "sip": sip_v,
    "domain": .domain,
    "rcode": rcode_v,
    "action": .event,
    "category": "",
    "answer_ip": answer_v,
    "detail": .message
  }
'''

[sinks.clickhouse]
type = "clickhouse"
inputs = ["normalize"]
endpoint = "http://clickhouse:8123"
database = "ipam"
table = "logs"
format = "json_each_row"
date_time_best_effort = true
auth.strategy = "basic"
auth.user = "${CLICKHOUSE_USER:-ipam}"
auth.password = "${CLICKHOUSE_PASSWORD:-}"
batch.max_bytes = 5_000_000
batch.timeout_secs = 5
# 有界磁盘缓冲：ClickHouse 短时不可用时保留最多 1GB，避免内存无限增长；
# 超过上限丢弃最新（drop_newest），优先保证采集端/宿主稳定。
buffer.type = "disk"
buffer.max_size = 1_000_000_000
buffer.when_full = "drop_newest"
request.retry_max_attempts = 10
request.retry_initial_backoff_secs = 1
request.retry_max_duration_secs = 60
healthcheck.enabled = true

# encoding 仅做字段过滤（codec 已移除：0.4x 由 format=json_each_row 承担序列化）
[sinks.clickhouse.encoding]
except_fields = ["message"]
