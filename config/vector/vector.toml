# Vector 日志采集链路（§6：Kea/Unbound → VRL 归一化 → ClickHouse logs 表）
# 关联键：client_mac 统一 12 位小写 hex（去冒号/短横线）；批量 5MB/5s 刷盘（FR-E-02）
# 版本契约：0.4x 语法——fallible 函数须 err 解构或 `!`；if/else 分支必须是块 { }

data_dir = "/var/lib/vector"

[sources.kea_stdout]
type = "file"
include = ["/var/log/kea/*.log"]
read_from = "beginning"

[sources.unbound_log]
type = "file"
include = ["/var/log/unbound/unbound.log"]
read_from = "beginning"

# ── Kea DHCPv4 租约/分配日志解析 ──
[transforms.parse_kea]
type = "remap"
inputs = ["kea_stdout"]
source = '''
  m, merr = parse_regex(.message, r'^(?P<ts>\S+ \S+) (?P<level>\w+) \[(?P<pid>\d+)\] DHCP4\.(?P<event>[A-Z0-9_]+) (?P<rest>.*)$')
  if merr != null {
    abort
  }
  .timestamp, terr = parse_timestamp(m.ts, format: "%Y-%m-%d %H:%M:%S.%f")
  if terr != null {
    .timestamp = now()
  }
  .severity = m.level
  .event = m.event
  mac_m, mac_err = parse_regex(m.rest, r'(?:hwaddr|HWAddr)=(?P<mac>[0-9a-fA-F:]{17})')
  if mac_err == null && mac_m != null {
    m1, e1 = replace(mac_m.mac, ":", "")
    m2 = replace(m1, "-", "")
    if e1 == null {
      .client_mac = downcase!(m2)
    } else {
      .client_mac = ""
    }
  } else {
    .client_mac = ""
  }
  ip_m, ip_err = parse_regex(m.rest, r'(?:assigned|address)=(?P<ip>\d+\.\d+\.\d+\.\d+)')
  if ip_err == null && ip_m != null {
    .address = ip_m.ip
  } else {
    .address = ""
  }
  .domain = ""
  .rtype = "dhcp"
'''

# ── Unbound 查询日志解析（verbosity 需 ≥1 且 log-queries）──
[transforms.parse_unbound]
type = "remap"
inputs = ["unbound_log"]
source = '''
  m, merr = parse_regex(.message, r'\[(?P<ts>\d+)\] unbound\[\d+:\d+\] info: (?P<srcip>\S+) (?P<qname>\S+) (?P<qtype>\S+) IN$')
  if merr != null {
    abort
  }
  .timestamp = now()
  .severity = "INFO"
  .event = "dns_query"
  .client_mac = ""
  .address = ""
  .sip = m.srcip
  .domain = m.qname
  .rtype = m.qtype
'''

# ── 归一化统一 schema（logs 宽表字段，§3 ClickHouse）──
# 空地址必须落 null（列 Nullable(IPv6)，'' 无法解析会整批失败）；
# ts 用毫秒字符串保游标精度。
[transforms.normalize]
type = "remap"
inputs = ["parse_kea", "parse_unbound"]
source = '''
  ip_v = if .address == "" { null } else { .address }
  mac_v = if .client_mac == "" { "" } else { downcase!(.client_mac) }
  sip_v = if .sip == "" || .sip == null { null } else { .sip }
  . = {
    "ts": format_timestamp!(.timestamp, "%F %T%.3f"),
    "type": .rtype,
    "severity": .severity,
    "client_mac": mac_v,
    "client_ip": ip_v,
    "sip": sip_v,
    "domain": .domain,
    "rcode": "",
    "action": .event,
    "category": "",
    "detail": .message
  }
'''

[sinks.clickhouse]
type = "clickhouse"
inputs = ["normalize"]
endpoint = "http://clickhouse:8123"
database = "ipam"
table = "logs"
format = "json_each_row"
date_time_best_effort = true
auth.strategy = "basic"
auth.user = "${CLICKHOUSE_USER:-ipam}"
auth.password = "${CLICKHOUSE_PASSWORD:-}"
batch.max_bytes = 5_000_000
batch.timeout_secs = 5
request.retry_max_attempts = 3
healthcheck.enabled = true

# encoding 仅做字段过滤（codec 已移除：0.4x 由 format=json_each_row 承担序列化）
[sinks.clickhouse.encoding]
except_fields = ["message"]
