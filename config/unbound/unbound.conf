server:
  verbosity: 1
  interface: 0.0.0.0
  port: 53
  do-ip4: yes
  do-udp: yes
  do-tcp: yes
  access-control: 0.0.0.0/0 allow
  # 容器内关闭 chroot（§6.2 安全由非 root + cap_drop 承担）；否则 logfile 会被解析到
  # <chroot>/var/log（即 /etc/unbound/var/log），与宿主卷挂载点 /var/log/unbound 错位
  chroot: ""
  username: "unbound"
  directory: "/etc/unbound"
  # intranet authoritative zone; coherence records pushed via local-data (S4.4)
  # 注意：不可用 local-zone: static —— 它会把整域未声明名拦截为 NXDOMAIN，
  # 使 auth-zone(zonefile) 内容（如 auth-only）永远轮不到；local-data 自身
  # 隐含的 local-zone(transparent) 已保证 K1 语义（local-data 优先 auth-zone）。
  local-data: "smoke.corp.local. 300 IN A 10.61.172.253"
  local-data: "overlap.corp.local. 300 IN A 10.61.172.250"
  # 日志链路（§6）：统一落盘到挂载卷供 vector 采集；分级采样开关 P1（FR-E-05）
  logfile: "/var/log/unbound/unbound.log"
  log-queries: yes
  # 应答事件由 python 模块 DNS_LOG 承载（含 answer_ip，信息为 log-replies 超集）；
  # 开启 log-replies 会使每条递归查询产生重复 resolve 事件，故关闭。
  # 注意：local-data 静态记录在 worker 层直接应答、不过模块链，无 DNS_LOG，
  # 因此 local-data 域名只有 dns_query 事件、无 resolve 事件（已知取舍）。
  log-replies: no
  use-syslog: no
  # Python 模块：解析完成后提取应答区 answer IP（dns_log.py 输出 DNS_LOG JSON）
  module-config: "python iterator"

python:
  python-script: /etc/unbound/dns_log.py

remote-control:
  control-enable: yes
  control-interface: /run/ipam/unbound-ctl.sock
  control-use-cert: no
# M3-009：动态段（缓存 TTL/RRL/解析记录/RPZ）由 control-plane 渲染落盘（include 展开）
include: "/etc/unbound-rendered/unbound-rendered.conf"
