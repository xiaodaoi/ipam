server:
  verbosity: 1
  interface: 0.0.0.0
  port: 53
  do-ip4: yes
  do-udp: yes
  do-tcp: yes
  access-control: 0.0.0.0/0 allow
  # 内网权威（§4.4 联动记录经 local_data 下发至此）
  local-zone: "corp.local." static
  username: "unbound"
  logfile: ""
  use-syslog: no

remote-control:
  control-enable: yes
  control-interface: /run/ipam/unbound-ctl.sock
  control-use-cert: no

# PoC 冒烟锚点：本地静态记录，验证权威应答与 reload 链路
local-data: "smoke.corp.local. 300 IN A 10.61.172.253"
