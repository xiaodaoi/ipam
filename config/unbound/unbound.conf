server:
  verbosity: 1
  interface: 0.0.0.0
  port: 53
  do-ip4: yes
  do-udp: yes
  do-tcp: yes
  access-control: 0.0.0.0/0 allow
  # intranet authoritative zone; coherence records pushed via local-data (S4.4)
  local-zone: "corp.local." static
  local-data: "smoke.corp.local. 300 IN A 10.61.172.253"
  logfile: ""
  use-syslog: no

remote-control:
  control-enable: yes
  control-interface: /run/ipam/unbound-ctl.sock
  control-use-cert: no
