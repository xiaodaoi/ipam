{
  "Dhcp6": {
    "interfaces-config": { "interfaces": ["eth0"] },
    "valid-lifetime": 3600,
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/ipam/kea6-ctrl.sock"
    },
    "lease-database": { "type": "memfile" },
    "subnet6": [
      {
        "id": 1,
        "subnet": "2406:172::/64",
        "pools": [ { "pool": "2406:172::-2406:172::ff" } ]
      }
    ],
    "loggers": [
      { "name": "kea-dhcp6", "severity": "INFO",
        "output-options": [ { "output": "stdout" } ] }
    ]
  }
}
