{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [
        "eth0"
      ]
    },
    "valid-lifetime": 3600,
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/ipam/kea4-ctrl.sock"
    },
    "lease-database": {
      "type": "memfile"
    },
    "subnet4": [
      {
        "id": 1,
        "subnet": "10.61.172.0/24",
        "pools": [
          {
            "pool": "10.61.172.100 - 10.61.172.200"
          }
        ],
        "option-data": [
          {
            "name": "routers",
            "data": "10.61.172.1"
          },
          {
            "name": "domain-name-servers",
            "data": "10.61.172.253"
          }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "severity": "INFO",
        "output_options": [
          {
            "output": "/var/log/kea/kea-dhcp4.log"
          }
        ]
      }
    ],
    "hooks-libraries": [
      {
        "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so"
      }
    ]
  }
}