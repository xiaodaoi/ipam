{
  "Control-agent": {
    "http-host": "0.0.0.0",
    "http-port": 8000,
    "control-sockets": {
      "dhcp4": { "socket-type": "unix", "socket-name": "/run/ipam/kea4-ctrl.sock" },
      "dhcp6": { "socket-type": "unix", "socket-name": "/run/ipam/kea6-ctrl.sock" }
    },
    "loggers": [
      { "name": "kea-ctrl-agent", "severity": "INFO",
        "output_options": [ { "output": "stdout" } ] }
    ]
  }
}
