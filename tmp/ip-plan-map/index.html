<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IP 规划 · 自研地址地图组件演示</title>
<!--
  完全离线版：所有依赖都在本地 lib/ 目录，双击打开即可，无需联网。
  如果页面空白，请按 F12 查看 Console 报错。
-->
<link rel="stylesheet" href="lib/reset.css" />
<style>
  body { background: #f5f6fa; margin: 0; }
  .code { background: #1f2430; color: #c9d1d9; padding: 12px 16px; border-radius: 6px;
          font-size: 12px; line-height: 1.7; overflow-x: auto; }
  #load-error { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<div id="load-error" style="font: 14px/1.7 monospace; color: #c0392b; padding: 24px; max-width: 720px;"></div>

<!-- 加载顺序有讲究：antd 需要 React/ReactDOM/dayjs 已就位；icons 需要 React 已就位 -->
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="lib/dayjs.min.js"></script>
<script src="lib/icons.umd.js"></script>
<!-- antd v5 采用 CSS-in-JS，样式由 antd.min.js 运行时注入 -->
<script src="lib/antd.min.js"></script>

<!-- 依赖加载检查：若 lib/ 缺失或顺序不对，给出可见提示而不是白屏 -->
<script>
  window.__showErr = function (msg) {
    var el = document.getElementById('load-error');
    if (!el) { alert(msg); return; }
    el.style.display = 'block';
    el.textContent = '页面加载失败：' + msg + '\n请按 F12 打开 Console 查看详细报错。';
  };
  setTimeout(function () {
    if (!window.React || !window.ReactDOM || !window.dayjs || !window.icons || !window.antd) {
      window.__showErr('本地依赖 lib/ 未加载成功（React / ReactDOM / dayjs / icons / antd 缺失）。' +
        '请确认 index.html 与 lib/ 目录在同一文件夹，且 lib/ 内文件完整。');
    }
  }, 500);
</script>

<!-- 预编译后的演示应用（JSX 已在 build.js 中编译成普通 JS） -->
<script src="demo.app.js"></script>
</body>
</html>
