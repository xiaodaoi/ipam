# IPAM 告警规则（M6-005）。指标来自 control-plane /metrics。
groups:
  - name: ipam-availability
    rules:
      - alert: IpamControlPlaneDown
        expr: up{job="ipam-control-plane"} == 0
        for: 2m
        labels:
          severity: critical
          team: ipam
        annotations:
          summary: "IPAM 控制面不可抓取"
          description: "Prometheus 连续 2 分钟无法抓取 {{ $labels.instance }}，请检查容器/网络。"

      - alert: IpamComponentDown
        expr: ipam_component_up == 0
        for: 3m
        labels:
          severity: critical
          team: ipam
        annotations:
          summary: "IPAM 组件 {{ $labels.component }} 不可用"
          description: "组件 {{ $labels.component }} 连续 3 分钟探针失败。"

  - name: ipam-capacity
    rules:
      - alert: IpamDiskWarning
        expr: ipam_host_disk_used_percent > 85
        for: 10m
        labels:
          severity: warning
          team: ipam
        annotations:
          summary: "宿主磁盘使用率 {{ $labels.mount }} > 85%"
          description: "当前 {{ $value | printf \"%.1f\" }}%，请清理日志归档或扩容。"

      - alert: IpamDiskCritical
        expr: ipam_host_disk_used_percent > 90
        for: 5m
        labels:
          severity: critical
          team: ipam
        annotations:
          summary: "宿主磁盘使用率 {{ $labels.mount }} > 90%"
          description: "当前 {{ $value | printf \"%.1f\" }}%，可能触发日志降级/写入失败。"

      - alert: IpamLogExportDegraded
        expr: ipam_log_export_degraded == 1
        for: 5m
        labels:
          severity: warning
          team: ipam
        annotations:
          summary: "日志采样已因磁盘水位自动降级"
          description: "日志采样已自动切换为仅异常；请清理归档/扩容，降至 85% 以下后自动恢复。"

      - alert: IpamMemoryHigh
        expr: ipam_host_memory_used_bytes / ipam_host_memory_total_bytes > 0.9
        for: 10m
        labels:
          severity: warning
          team: ipam
        annotations:
          summary: "宿主内存使用率 > 90%"
          description: "当前 {{ $value | printf \"%.2f\" }}，请检查进程与容器限制。"

      - alert: IpamTLSCertExpiring
        expr: (ipam_tls_cert_expiry_timestamp_seconds - time()) < 30 * 86400
        for: 1h
        labels:
          severity: warning
          team: ipam
        annotations:
          summary: "控制面 TLS 证书 30 天内到期"
          description: "请提前轮换证书并重启 control-plane。"

      - alert: IpamHTTP5xx
        expr: sum(rate(ipam_http_requests_total{status=~"5.."}[5m])) > 1
        for: 5m
        labels:
          severity: warning
          team: ipam
        annotations:
          summary: "IPAM API 5xx 速率 > 1/s"
          description: "请检查 control-plane 日志与依赖（PG/CH/Kea）。"

      - alert: IpamSubnetUtilizationHigh
        expr: ipam_subnet_utilization_percent > 85
        for: 15m
        labels:
          severity: warning
          team: ipam
        annotations:
          summary: "子网 {{ $labels.subnet }}（{{ $labels.cidr }}）利用率 > 85%"
          description: "当前 {{ $value | printf \"%.1f\" }}%，请扩容地址池或清理闲置保留。"

      - alert: IpamSubnetUtilizationCritical
        expr: ipam_subnet_utilization_percent > 95
        for: 5m
        labels:
          severity: critical
          team: ipam
        annotations:
          summary: "子网 {{ $labels.subnet }}（{{ $labels.cidr }}）利用率 > 95%"
          description: "地址池即将耗尽，请立即扩容。"

      - alert: IpamLogPartsHigh
        expr: ipam_log_parts > 500
        for: 15m
        labels:
          severity: warning
          team: ipam
        annotations:
          summary: "ClickHouse logs 活跃分区数 > 500"
          description: "分区/part 过多会拖慢查询与合并，请检查写入批次与后台 merge。"

      - alert: IpamLogIngestStalled
        expr: ipam_log_latest_age_seconds > 600
        for: 10m
        labels:
          severity: critical
          team: ipam
        annotations:
          summary: "日志 10 分钟无新数据"
          description: "检查 Vector/ClickHouse/Kea/Unbound 采集链路；当前最新日志已滞后 {{ $value }} 秒。"

      - alert: IpamLogDiskGrowthFast
        expr: increase(ipam_log_disk_bytes[6h]) > 5368709120
        for: 30m
        labels:
          severity: warning
          team: ipam
        annotations:
          summary: "日志磁盘 6 小时增长 > 5GB"
          description: "可能存在日志洪峰/重放，检查 Vector checkpoint 与日志量。"

      - alert: IpamLogDiskRatioHigh
        expr: ipam_log_disk_bytes / max(ipam_host_disk_total_bytes) > 0.6
        for: 30m
        labels:
          severity: warning
          team: ipam
        annotations:
          summary: "日志占用超过磁盘总量 60%"
          description: "请评估保留天数/归档策略或扩容；日志盘即将影响其他组件。"

      - alert: IpamLicenseTerminalsOverLimit
        expr: ipam_license_terminals_used > ipam_license_terminals_limit and ipam_license_terminals_limit > 0
        for: 6h
        labels:
          severity: warning
          team: ipam
        annotations:
          summary: "活跃终端数超过 License 上限"
          description: "当前 {{ $value }} 台活跃终端已超过授权上限，服务不中断；请联系授权方扩容或清理长期离线终端。"

      # ── Vector 外发/入库积压（M6-008，需抓取 vector:9598）──
      - alert: IpamLogSinkBacklog
        expr: |
          vector_buffer_byte_size{component_id=~"clickhouse|siem_.*"}
            / vector_buffer_max_byte_size{component_id=~"clickhouse|siem_.*"} > 0.5
        for: 15m
        labels:
          severity: warning
          team: ipam
        annotations:
          summary: "日志外发/入库积压（缓冲 >50%）"
          description: "{{ $labels.component_id }} 目标持续写入失败或变慢，缓冲占用已超 50%；检查 ClickHouse/SIEM 连通性与吞吐。"

      - alert: IpamLogSinkBufferFull
        expr: |
          vector_buffer_byte_size{component_id=~"clickhouse|siem_.*"}
            / vector_buffer_max_byte_size{component_id=~"clickhouse|siem_.*"} > 0.9
        for: 5m
        labels:
          severity: critical
          team: ipam
        annotations:
          summary: "日志外发缓冲接近上限，即将丢弃最新日志"
          description: "{{ $labels.component_id }} 缓冲 >90%；缓冲为有界 drop_newest，再满会丢弃最新日志，请立即处理目标端。"

      - alert: IpamLogSinkErrors
        expr: increase(vector_component_errors_total{component_kind="sink"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
          team: ipam
        annotations:
          summary: "日志外发 sink 报错"
          description: "{{ $labels.component_id }} 近 10 分钟出现发送错误（重试中）；检查目标端与鉴权配置。"
