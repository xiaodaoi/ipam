# IPAM Prometheus 抓取配置（M6-005）
# 与 deploy/compose 同网络时直接使用 control-plane:8443；外部部署改为实际地址。
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: ipam-control-plane
    metrics_path: /metrics
    # /metrics 令牌保护（M6-017）：令牌由 install.sh 写入 observability/metrics_token 并挂载。
    # 若未在 IPAM 侧设置 IPAM_METRICS_TOKEN，可删除本段（文件不存在会导致 Prometheus 启动失败）。
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['control-plane:8443']
        labels:
          service: ipam-control-plane
          env: production

  # Vector 自身指标（M6-008）：外发/入 CH 的缓冲积压与丢弃，用于「外发积压」告警。
  - job_name: ipam-vector
    metrics_path: /metrics
    static_configs:
      - targets: ['vector:9598']
        labels:
          service: ipam-vector
          env: production
