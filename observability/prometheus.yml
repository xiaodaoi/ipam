# IPAM Prometheus 抓取配置（M6-005）
# 与 deploy/compose 同网络时直接使用 control-plane:8443；外部部署改为实际地址。
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: ipam-control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ['control-plane:8443']
        labels:
          service: ipam-control-plane
          env: production
