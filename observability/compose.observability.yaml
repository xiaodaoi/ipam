# 可选监控栈（M6-005）：docker compose -f compose.observability.yaml --profile observability up -d
# 前置：IPAM 已由 deploy/compose 启动（网络 ipam_default 已存在）。
name: ipam-observability
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [ipam]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [observability]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [ipam]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in environment}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana:/etc/grafana/provisioning:ro
      - graf-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [ipam]
    restart: unless-stopped

networks:
  ipam:
    external: true
    name: ipam_default

volumes:
  prom-data:
  am-data:
  graf-data:
