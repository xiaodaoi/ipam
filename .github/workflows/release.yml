name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            dockerfile: deploy/images/control-plane/Dockerfile
          - name: coherence-daemon
            dockerfile: deploy/images/coherence-daemon/Dockerfile
          - name: unbound
            dockerfile: deploy/images/unbound/Dockerfile
          - name: kea-dhcp4
            dockerfile: deploy/images/kea/Dockerfile
            build_args: COMPONENT=kea-dhcp4-server
          - name: kea-dhcp6
            dockerfile: deploy/images/kea/Dockerfile
            build_args: COMPONENT=kea-dhcp6-server
          - name: kea-ctrl-agent
            dockerfile: deploy/images/kea/Dockerfile
            build_args: COMPONENT=kea-ctrl-agent
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build & push（amd64 + arm64，含 SBOM/provenance）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}:latest
          sbom: true
          provenance: true
      - name: SBOM artifact
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
      - uses: sigstore/cosign-installer@v3
      - name: cosign keyless sign
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"

  release-notes:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "镜像：ghcr.io/${{ github.repository }}/*:$GITHUB_REF_NAME（amd64/arm64，SBOM + cosign keyless）。"
