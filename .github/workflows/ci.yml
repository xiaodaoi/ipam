name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  # ── 闸① spec lint：§12.4 文档完备性（description/example/operationId）──
  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: spectral lint（先 bundle 以解析多文件引用）
        run: |
          npx --yes @redocly/cli@1 bundle api/openapi/openapi.yaml -o /tmp/lint-bundle.yaml --force >/dev/null
          npx --yes @stoplight/spectral-cli@6 lint /tmp/lint-bundle.yaml --ruleset .spectral.yaml --fail-severity=error

  # ── 闸② 路由覆盖率(TestRoutesCoveredBySpec) + 闸④ go test/vet/lint ──
  go-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: stub webui（fresh clone 无前端产物时保证 embed 编译与 fallback 测试有效）
        run: |
          mkdir -p cmd/control-plane/webui/dist
          grep -q index.html cmd/control-plane/webui/dist/index.html 2>/dev/null || \
            printf '<!doctype html><meta charset="utf-8"><title>stub</title>' > cmd/control-plane/webui/dist/index.html
      - name: build & vet
        run: go build ./... && go vet ./...
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          "$(go env GOPATH)/bin/golangci-lint" run
      - name: test（含闸② TestRoutesCoveredBySpec）
        run: go test ./...

  # ── 闸③ 破坏性变更检测（PR 时对基线分支比对）──
  openapi-diff:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: oasdiff breaking
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          npx --yes oasdiff breaking \
            "origin/${{ github.base_ref }}:api/openapi/openapi.yaml" \
            "api/openapi/openapi.yaml" \
            --fail-on ERR

  # ── 闸⑤ web 构建+typecheck+零外链断言 ──
  web-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install & typecheck & build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @vben/web-ipam run typecheck
          pnpm run build:ipam
      - name: sync & 零外链断言
        run: |
          bash scripts/sync-webui.sh
          bash scripts/check-webui-offline.sh

  # ── K4：C++ hook 核心库编译+测试+行数门禁（Kea 胶水层需真机头文件，CI 跳过）──
  hook-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: build & test core lib
        run: |
          set -o pipefail
          { cmake -S hook-coherence -B hook-coherence/build \
            && cmake --build hook-coherence/build --verbose \
            && ctest --test-dir hook-coherence/build --output-on-failure; } \
            | tee /tmp/hook-build.log
      - name: 行数门禁(<800)
        run: bash scripts/check-hook-lines.sh
      - name: push diagnostics branch
        if: failure()
        run: |
          git config user.email "ci@ipam.local"
          git config user.name "ci-diag"
          tail -c 6000 /tmp/hook-build.log > diag-hook.txt || true
          git add diag-hook.txt && git commit -m "ci hook diag ${GITHUB_RUN_ID}"
          git push -f origin "HEAD:refs/heads/ci-diag"

  # ── 闸⑥ compose 冒烟（M0-006 落地前自动跳过）──
  compose-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      POSTGRES_PASSWORD: ci-smoke-password
    steps:
      - uses: actions/checkout@v4
      - name: smoke
        run: |
          if [ ! -f deploy/compose/compose.yaml ]; then
            echo "skip: compose.yaml 未落地（M0-006）"; exit 0
          fi
          cd deploy/compose && docker compose up -d --wait
          echo "[1] control-plane"
          curl -fsS http://127.0.0.1:8443/api/v1/system/info | grep -q ipam-control-plane
          echo "[2] kea ctrl-agent api"
          curl -fsS -X POST "http://127.0.0.1:${KEA_API_PORT:-8000}/" \
            -H 'Content-Type: application/json'             -d '{"command":"version-get","service":["dhcp4"]}' | grep -q '"result": 0'
          echo "[3] unbound version >= 1.16"
          V=$(docker compose exec -T unbound sh -c 'unbound -V' | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ "$(printf '1.16.0\n%s\n' "$V" | sort -V | head -1)" = "1.16.0" ] || { echo "unbound $V < 1.16"; exit 1; }
          echo "[4] static authoritative answer"
          docker compose exec -T unbound dig @127.0.0.1 smoke.corp.local +short | grep -q 10.61.172.253
          echo "[4b] K1: local-data wins over auth-zone"
          docker compose exec -T unbound dig @127.0.0.1 auth-only.corp.local +short | grep -q 10.0.0.99
          docker compose exec -T unbound dig @127.0.0.1 overlap.corp.local +short | grep -q 10.61.172.250
          echo "[5] local_data hot inject"
          docker compose exec -T unbound sh -c \
            'unbound-control local_data "dyn-test.corp.local. 60 IN A 10.61.172.99"'
          docker compose exec -T unbound dig @127.0.0.1 dyn-test.corp.local +short | grep -q 10.61.172.99
          echo "[6] CH logs retrieval (M4-002)"
          docker compose exec -T clickhouse clickhouse-client --query \
            "INSERT INTO ipam.logs (ts,type,severity,client_mac,client_ip,sip,domain,rcode,action,category,detail) VALUES ($(date -u +%s),'dns','INFO','aabbccddee99',toIPv6('::ffff:10.61.172.42'),NULL,'smoke-logs.corp.local.','NOERROR','resolve','','gate6')"
          sleep 1
          FROM=$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          curl -fsS "http://127.0.0.1:8443/api/v1/logs?from=${FROM}" | grep -q aabbccddee99
          echo "[7] CH logs TopN"
          docker compose exec -T clickhouse clickhouse-client --query "SELECT count() FROM ipam.logs_topn_hourly" | grep -qE '[1-9]'
          echo "ALL-PASS"
          docker compose down -v
      - name: collect diagnostics
        if: failure()
        run: |
          cd deploy/compose
          {
            echo "== replay assertions on live stack =="
            echo "-- [1]"; curl -sS http://127.0.0.1:8443/api/v1/system/info || true
            echo; echo "-- [2]"; curl -sS -X POST "http://127.0.0.1:${KEA_API_PORT:-8000}/" -H 'Content-Type: application/json' -d '{"command":"version-get","service":["dhcp4"]}' || true
            echo; echo "-- [3]"; docker compose exec -T unbound sh -c 'unbound -V' | head -1 || true
            echo; echo "-- [4]"; docker compose exec -T unbound dig @127.0.0.1 smoke.corp.local +short || true
            echo;             echo "-- [5] inject+dig"
            docker compose exec -T unbound sh -c 'unbound-control local_data "dyn-test.corp.local. 60 IN A 10.61.172.99"' || true
            docker compose exec -T unbound dig @127.0.0.1 dyn-test.corp.local +short || true
            echo "-- [6] logs endpoint"
            curl -sS "http://127.0.0.1:8443/api/v1/logs?from=$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" || true
            echo; echo "-- [7] logs table"
            docker compose exec -T clickhouse clickhouse-client --query "SELECT count() FROM ipam.logs" || true
            echo; echo "== ps =="; docker compose ps -a
            echo; echo "== logs(tail) =="; docker compose logs --tail=120
          } > diag.txt 2>&1 || true
      - name: push diagnostics branch
        if: failure()
        run: |
          git config user.email "ci@ipam.local"
          git config user.name "ci-diag"
          cp deploy/compose/diag.txt diag-latest.txt
          git add diag-latest.txt && git commit -m "ci diag ${GITHUB_RUN_ID}"
          git push -f origin "HEAD:refs/heads/ci-diag"
