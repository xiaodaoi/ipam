name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  # ── 闸① spec lint：§12.4 文档完备性（description/example/operationId）──
  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: spectral lint
        run: npx --yes @stoplight/spectral-cli@6 lint api/openapi/openapi.yaml --ruleset .spectral.yaml --fail-severity=error

  # ── 闸② 路由覆盖率(TestRoutesCoveredBySpec) + 闸④ go test/vet/lint ──
  go-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: stub webui（fresh clone 无前端产物时保证 embed 编译与 fallback 测试有效）
        run: |
          mkdir -p cmd/control-plane/webui/dist
          grep -q index.html cmd/control-plane/webui/dist/index.html 2>/dev/null || \
            printf '<!doctype html><meta charset="utf-8"><title>stub</title>' > cmd/control-plane/webui/dist/index.html
      - name: build & vet
        run: go build ./... && go vet ./...
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          "$(go env GOPATH)/bin/golangci-lint" run
      - name: test（含闸② TestRoutesCoveredBySpec）
        run: go test ./...

  # ── 闸③ 破坏性变更检测（PR 时对基线分支比对）──
  openapi-diff:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: oasdiff breaking
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          npx --yes oasdiff breaking \
            "origin/${{ github.base_ref }}:api/openapi/openapi.yaml" \
            "api/openapi/openapi.yaml" \
            --fail-on ERR

  # ── 闸⑤ web 构建+typecheck+零外链断言 ──
  web-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install & typecheck & build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @vben/web-ipam run typecheck
          pnpm run build:ipam
      - name: sync & 零外链断言
        run: |
          bash scripts/sync-webui.sh
          bash scripts/check-webui-offline.sh

  # ── K4：C++ hook 核心库编译+测试+行数门禁（Kea 胶水层需真机头文件，CI 跳过）──
  hook-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: build & test core lib
        run: |
          set -o pipefail
          { cmake -S hook-coherence -B hook-coherence/build \
            && cmake --build hook-coherence/build --verbose \
            && ctest --test-dir hook-coherence/build --output-on-failure; } \
            | tee /tmp/hook-build.log
      - name: 行数门禁(<800)
        run: bash scripts/check-hook-lines.sh
      - name: push diagnostics branch
        if: failure()
        run: |
          git config user.email "ci@ipam.local"
          git config user.name "ci-diag"
          tail -c 6000 /tmp/hook-build.log > diag-hook.txt || true
          git add diag-hook.txt && git commit -m "ci hook diag ${GITHUB_RUN_ID}"
          git push -f origin "HEAD:refs/heads/ci-diag"

  # ── 闸⑥ compose 冒烟（M0-006 落地前自动跳过）──
  compose-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      POSTGRES_PASSWORD: ci-smoke-password
    steps:
      - uses: actions/checkout@v4
      - name: smoke
        run: |
          exec > >(tee /tmp/smoke.log) 2>&1
          if [ ! -f deploy/compose/compose.yaml ]; then
            echo "skip: compose.yaml 未落地（M0-006）"; exit 0
          fi
          cd deploy/compose && docker compose up -d --wait
          # 控制面
          curl -fsS http://127.0.0.1:8443/api/v1/system/info | grep -q ipam-control-plane
          # Kea Ctrl Agent 通道（闸：config 下发面）
          curl -fsS -X POST "http://127.0.0.1:${KEA_API_PORT:-8000}/" \
            -H 'Content-Type: application/json' \
            -d '{"command":"version-get","service":["dhcp4"]}' | grep -q '"result": 0'
          # Unbound 版本断言（K8：≥1.16）
          V=$(docker compose exec -T unbound sh -c 'unbound -V' | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ "$(printf '1.16.0\n%s\n' "$V" | sort -V | head -1)" = "1.16.0" ] || { echo "unbound $V < 1.16"; exit 1; }
          # Unbound 权威应答（静态锚点）
          docker compose exec -T unbound dig @127.0.0.1 smoke.corp.local +short | grep -q 10.61.172.253
          # 联动热更新链路：local_data 动态注入 → 立即可解析（§2.3/§4.4）
          docker compose exec -T unbound sh -c \
            'echo "local_data=dyn-test.corp.local. 60 IN A 10.61.172.99" | unbound-control -s /run/ipam/unbound-ctl.sock'
          docker compose exec -T unbound dig @127.0.0.1 dyn-test.corp.local +short | grep -q 10.61.172.99
          docker compose down -v
      - name: collect diagnostics
        if: failure()
        run: |
          cd deploy/compose
          {
            echo "== smoke log =="; cat /tmp/smoke.log || true
            echo; echo "== compose build tail ==";
            docker compose build --no-cache --progress=plain 2>&1 | tail -60 || true
            echo; echo "== ps ==";   docker compose ps -a
            echo; echo "== logs =="; docker compose logs --tail=200
          } > diag.txt 2>&1 || true
      - name: push diagnostics branch
        if: failure()
        run: |
          git config user.email "ci@ipam.local"
          git config user.name "ci-diag"
          cp deploy/compose/diag.txt diag-latest.txt
          git add diag-latest.txt && git commit -m "ci diag ${GITHUB_RUN_ID}"
          git push -f origin "HEAD:refs/heads/ci-diag"
