SettingsCollection:
  get:
    operationId: getDnsSettings
    tags: [dns]
    summary: 查询 DNS 行为参数（缓存+安全）
    description: 返回当前生效的缓存与安全参数；参数变更经 unbound.conf 重渲染+checkconf+reload 三步走。
    security: []
    responses:
      '200':
        description: 当前参数
        content:
          application/json:
            schema:
              $ref: '../components/schemas/settings.yaml#/DnsSettings'
            examples:
                ok:
                  summary: 默认参数
                  value:
                    cacheMinTtl: 0
                    cacheMaxTtl: 86400
                    serveExpired: false
                    rrlEnabled: true
                    rrlRate: 500
                    dnssecValidate: false
  put:
    operationId: updateDnsSettings
    tags: [dns]
    summary: 更新 DNS 行为参数（渲染→checkconf→reload）
    description: 校验失败返回 400 且不改动运行配置（checkconf 失败即回滚）。所需 scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/settings.yaml#/DnsSettings'
    responses:
      '200':
        description: 已更新并 reload
        content:
          application/json:
            schema:
              $ref: '../components/schemas/settings.yaml#/DnsSettings'
      '400':
        description: checkconf 校验失败（未生效）
        content:
          application/problem+json:
            schema:
              type: object
              required: [type, title, status]
              properties:
                type: { type: string }
                title: { type: string }
                status: { type: integer }
                code: { type: string }
TtlOverridesCollection:
  get:
    operationId: listTtlOverrides
    tags: [dns]
    summary: 查询每域名 TTL 覆盖列表
    description: F-R3——对 DDNS/CDN 敏感域名单独设置较小 TTL，覆盖全局缓存策略。
    security: []
    responses:
      '200':
        description: 覆盖列表
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '../components/schemas/settings.yaml#/PerDomainTtl'
              required: [items]
  put:
    operationId: upsertTtlOverride
    tags: [dns]
    summary: 设置或更新域名 TTL 覆盖（reload 生效）
    description: 以域名为键幂等写入，reload 后生效。所需 scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/settings.yaml#/PerDomainTtl'
    responses:
      '200':
        description: 已设置
        content:
          application/json:
            schema:
              $ref: '../components/schemas/settings.yaml#/PerDomainTtl'
CacheFlush:
  post:
    operationId: flushCache
    tags: [dns]
    summary: 清空缓存（全部或指定 zone）
    description: 经 unbound-control flush 或 flush_zone 执行，zone 缺省为全部清空。所需 scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              zone:
                type: string
                nullable: true
                description: 指定 zone 名，缺省清空全部
    responses:
      '200':
        description: 已清空
        content:
          application/json:
            schema:
              $ref: '../components/schemas/settings.yaml#/FlushResult'
ConfApply:
  post:
    operationId: applyDnsConf
    tags: [dns]
    summary: 应用五源合成 unbound.conf（渲染→checkconf→原子落盘→reload）
    description: |
      从各域仓储聚合上游/转发/解析记录/封禁/参数五源，合成完整 unbound.conf，
      经 checkconf 校验后原子替换并 reload。校验失败返回 400 且运行态不变。
      所需 scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: 应用成功（回显合成摘要）
        content:
          application/json:
            schema:
              type: object
              properties:
                ok: { type: boolean }
                applied: { type: object }
              required: [ok]
          examples:
            ok:
              summary: 应用完成
              value: { ok: true }
      '400':
        description: checkconf 校验失败（未生效）
        content:
          application/problem+json:
            schema:
              type: object
              required: [type, title, status]
              properties:
                type: { type: string }
                title: { type: string }
                status: { type: integer }
                code: { type: string }
