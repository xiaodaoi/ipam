UpstreamsCollection:
  get:
    operationId: listUpstreams
    tags: [dns]
    summary: 查询上游服务器（含探活状态）
    description: 探活状态由 prober 周期维护（3 连败摘除/2 连胜回切）。
    security: []
    responses:
      '200':
        description: 上游列表
        content:
          application/json:
  post:
    operationId: createUpstream
    tags: [dns]
    summary: 创建上游（触发 forward-zone 下发）
    description: 落库后经 unbound 通道生效（forward_add）。scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/upstream.yaml#/UpstreamCreate'
            examples:
                ali:
                  value: { name: 阿里, addrs: ["223.5.5.5"], protocol: udp, weight: 2 }
    responses:
      '201':
        description: 已创建
        content:
          application/json:
UpstreamItem:
  patch:
    operationId: updateUpstream
    tags: [dns]
    summary: 更新上游（重新下发）
    description: 变更后触发 forward-zone 重收敛；探活状态由 prober 刷新。所需 scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: upstreamId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/upstream.yaml#/UpstreamUpdate'
    responses:
      '200':
        description: 已更新
        content:
          application/json:
  delete:
    operationId: deleteUpstream
    tags: [dns]
    summary: 删除上游（forward_remove）
    description: 从 forward-zone 移除并停止探测；历史 RTT 记录保留用于审计。所需 scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    x-risk-level: destructive
    parameters:
      - name: upstreamId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204':
        description: 已删除
