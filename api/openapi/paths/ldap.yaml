LDAPSettings:
  get:
    operationId: getLDAPSettings
    tags: [system]
    summary: 读取 LDAP/AD 设置
    description: 不返回 bindPassword；用 hasBindPassword 表示已配置。scope 为 system:read。
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: 当前设置
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ldap.yaml#/LDAPSettings'
  put:
    operationId: updateLDAPSettings
    tags: [system]
    summary: 保存 LDAP/AD 设置
    description: bindPassword 留空保持原值；scope 为 system:write。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ldap.yaml#/LDAPSettings'
    responses:
      '200':
        description: 已保存
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ldap.yaml#/LDAPSettings'
      '400':
        description: 参数非法
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'

LDAPTest:
  post:
    operationId: testLDAPLogin
    tags: [system]
    summary: 测试 LDAP 登录
    description: 用指定账号口令执行一次真实 bind，返回组与映射角色（不创建用户）。scope 为 system:write。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ldap.yaml#/LDAPTestRequest'
    responses:
      '200':
        description: 认证成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ldap.yaml#/LDAPTestResult'
      '401':
        description: 账号或口令错误
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '503':
        description: 目录服务不可达
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
