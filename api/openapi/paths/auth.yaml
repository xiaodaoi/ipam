# 认证契约（M5-001 PoC 直通；正式 JWT/RBAC 见 §12.3、M5-002）
# 说明：本组端点为 M5 里程碑第一步——打通前端登录链路，鉴权语义为最小实现
# （固定账号 + HMAC 签名 token），字段形状与 vben UserInfo 对齐，M5-002 无缝升级。

AuthLogin:
  post:
    operationId: authLogin
    tags: [auth]
    summary: 登录颁发访问/刷新令牌
    description: |
      校验账号口令（bcrypt），签发 HS256 JWT accessToken（24h）+ refreshToken（7d，M5-032）。
      按客户端 IP 限流：5 次/分钟，超限返回 429（M5-032）。
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/AuthLoginRequest'
    responses:
      '200':
        description: 令牌对
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/AuthLoginResult'
            examples:
              ok:
                summary: 校验通过
                value: { accessToken: "eyJhbGciOiJIUzI1NiIs...sig", refreshToken: "eyJhbGciOiJIUzI1NiIs...sig" }
      '401':
        description: 账号或口令错误
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
            examples:
              badCred:
                summary: 凭据错误
                value:
                  type: 'https://ipam.local/problems/unauthorized'
                  title: Unauthorized
                  status: 401
                  code: BAD_CREDENTIALS
                  detail: 账号或口令错误
      '429':
        description: 登录尝试过于频繁（每 IP 5 次/分钟）
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
            examples:
              rateLimited:
                summary: 触发限流
                value:
                  type: 'https://ipam.local/problems/rate-limit'
                  title: Too Many Requests
                  status: 429
                  code: LOGIN_RATE_LIMITED
                  detail: 登录尝试过于频繁，请稍后重试

AuthRefresh:
  post:
    operationId: authRefresh
    tags: [auth]
    summary: 刷新访问令牌（轮换刷新令牌）
    description: |
      校验 refreshToken（签名/过期/kind=refresh/黑名单）后颁发新令牌对；
      旧刷新令牌 jti 先入黑名单再签发（轮换防重放，M5-032）。
      请求体缺省 refreshToken 时降级校验 Authorization Bearer 访问令牌
      （签名有效 + 未吊销 + 过期后 7 天宽限窗口内）。
    security: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/AuthRefreshRequest'
    responses:
      '200':
        description: 新令牌对
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/AuthRefreshResult'
            examples:
              ok:
                summary: 轮换成功
                value: { accessToken: "eyJhbGciOiJIUzI1NiIs...sig", refreshToken: "eyJhbGciOiJIUzI1NiIs...sig" }
      '401':
        description: 刷新令牌无效/过期/已吊销
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
            examples:
              revoked:
                summary: 已吊销
                value:
                  type: 'https://ipam.local/problems/unauthorized'
                  title: Unauthorized
                  status: 401
                  code: TOKEN_REVOKED
                  detail: 刷新令牌已吊销

AuthUserInfo:
  get:
    x-alias-of: /auth/user/info
    operationId: getAuthUserInfo
    tags: [auth]
    summary: 当前登录用户信息
    description: |
      按请求携带的 Authorization Bearer 令牌解析身份；无效/缺失返回 401。
      同时以 /user/info（vben 前端约定路径）提供同一资源，operationId=getAuthUserInfoAlias。
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: 用户信息（vben UserInfo 形状）
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/UserInfo'
            examples:
              ok:
                summary: admin 会话
                value:
                  userId: "1"
                  username: admin
                  realName: 管理员
                  avatar: ""
                  roles: ["admin"]
                  desc: IPAM 控制面管理员
                  homePath: "/overview"
                  token: ""
      '401':
        $ref: '../components/responses/auth.yaml#/AuthUnauthorized'

AuthCodes:
  get:
    operationId: listAuthCodes
    tags: [auth]
    summary: 当前用户权限码
    description: 权限码与 scope 同源（§13.2）；PoC 阶段返回空数组=不启用按钮级权限。
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: 权限码列表
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/AuthCodesList'
            examples:
              ok:
                summary: 空=全放行
                value: []
      '401':
        $ref: '../components/responses/auth.yaml#/AuthUnauthorized'

AuthLogout:
  post:
    operationId: logoutAuth
    tags: [auth]
    summary: 注销当前会话
    description: |
      吊销当前访问令牌 jti 入黑名单（至自然过期，M5-011）；
      请求体携带 refreshToken 时一并吊销其 jti（M5-032：双令牌吊销）。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/AuthLogoutRequest'
    responses:
      '200':
        description: 已注销
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/AuthLogoutDone'
            examples:
              ok:
                summary: 成功
                value: { ok: true }

UserAliasInfo:
  get:
    operationId: getAuthUserInfoAlias
    tags: [auth]
    summary: 当前登录用户信息（/user/info 别名）
    description: |
      与 getAuthUserInfo 同一资源：vben 底座 fetchUserInfo 约定路径为 GET /user/info，
      本别名保证底座升级零侵入。响应与 AuthUserInfo 完全一致。
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: 用户信息
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/UserInfo'
            examples:
              ok:
                summary: admin 会话
                value:
                  userId: "1"
                  username: admin
                  realName: 管理员
                  roles: ["admin"]
                  homePath: "/overview"
      '401':
        $ref: '../components/responses/auth.yaml#/AuthUnauthorized'

AuthChangePassword:
  post:
    operationId: changeAuthPassword
    tags: [auth]
    summary: 修改当前账号口令
    description: |
      校验旧口令后更新为新口令，并清除 mustChangePassword 标记。
      成功后 token_version+1（其他设备/旧令牌立即失效），返回新的访问/刷新令牌对。
      新口令遵循 M6-001 口令策略：10–128 位、至少 3 类字符、不得含用户名、不得与旧口令相同。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/AuthChangePasswordRequest'
    responses:
      '200':
        description: 修改成功并颁发新令牌对
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/AuthLoginResult'
            examples:
              ok:
                summary: 修改成功
                value:
                  accessToken: "eyJhbGciOiJIUzI1NiIs...sig"
                  refreshToken: "eyJhbGciOiJIUzI1NiIs...sig"
                  mustChangePassword: false
      '400':
        description: 新口令不满足策略
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
            examples:
              weak:
                summary: 口令过弱
                value:
                  type: 'https://ipam.local/problems/bad-request'
                  title: Bad Request
                  status: 400
                  code: WEAK_PASSWORD
                  detail: 口令至少 10 位，且需包含小写/大写/数字/符号中的 3 类
      '401':
        description: 未认证或旧口令错误
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
            examples:
              badOld:
                summary: 旧口令错误
                value:
                  type: 'https://ipam.local/problems/unauthorized'
                  title: Unauthorized
                  status: 401
                  code: BAD_CREDENTIALS
                  detail: 当前口令不正确
AuthTotpSetup:
  post:
    operationId: setupTotp
    tags: [auth]
    summary: 生成 TOTP 密钥
    description: 生成并保存待确认 TOTP 密钥，返回 secret 与 otpauth URI；需再次调用 enable 并输入动态口令后生效。
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: 待确认密钥
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/TotpSetupResult'
      '401':
        $ref: '../components/responses/auth.yaml#/AuthUnauthorized'

AuthTotpEnable:
  post:
    operationId: enableTotp
    tags: [auth]
    summary: 启用 TOTP
    description: 校验动态口令后启用双因素认证。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/TotpEnableRequest'
    responses:
      '200':
        description: 已启用
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/AuthLoginResult'
      '400':
        description: 动态口令错误
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'

AuthTotpDisable:
  post:
    operationId: disableTotp
    tags: [auth]
    summary: 关闭 TOTP
    description: 校验当前口令后关闭双因素认证并清除密钥。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/TotpDisableRequest'
    responses:
      '204': { description: 已关闭 }
      '401':
        description: 当前口令错误
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'

AuthLogoutAll:
  post:
    operationId: logoutAll
    tags: [auth]
    summary: 注销全部会话
    description: 提升当前账号 token_version，使所有设备上的访问/刷新令牌立即失效。
    security: [{ bearerAuth: [] }]
    responses:
      '204': { description: 已注销全部会话 }
