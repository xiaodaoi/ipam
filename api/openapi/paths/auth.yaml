# 认证契约（M5-001 PoC 直通；正式 JWT/RBAC 见 §12.3、M5-002）
# 说明：本组端点为 M5 里程碑第一步——打通前端登录链路，鉴权语义为最小实现
# （固定账号 + HMAC 签名 token），字段形状与 vben UserInfo 对齐，M5-002 无缝升级。

AuthLogin:
  post:
    operationId: authLogin
    tags: [auth]
    summary: 登录颁发访问令牌（PoC 直通）
    description: |
      校验固定账号（admin / IPAM_POC_PASSWORD），签发 HMAC 形状 accessToken。
      正式多用户/JWT/Bot Token 由 M5-002 替换（§12.3），响应结构保持兼容。
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/AuthLoginRequest'
    responses:
      '200':
        description: 令牌
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/AuthLoginResult'
            examples:
              ok:
                summary: 校验通过
                value: { accessToken: "poc.MTc1NjI4.9f2a7b" }
      '401':
        description: 账号或口令错误
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
            examples:
              badCred:
                summary: 凭据错误
                value:
                  type: 'https://ipam.local/problems/unauthorized'
                  title: Unauthorized
                  status: 401
                  code: BAD_CREDENTIALS
                  detail: 账号或口令错误

AuthUserInfo:
  get:
    operationId: getAuthUserInfo
    tags: [auth]
    summary: 当前登录用户信息
    description: 按请求携带的 Authorization Bearer 令牌解析身份；无效/缺失返回 401。
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: 用户信息（vben UserInfo 形状）
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/UserInfo'
            examples:
              ok:
                summary: admin 会话
                value:
                  userId: "1"
                  username: admin
                  realName: 管理员
                  avatar: ""
                  roles: ["admin"]
                  desc: IPAM 控制面管理员
                  homePath: "/overview"
                  token: ""
      '401':
        $ref: '../components/responses/auth.yaml#/AuthUnauthorized'

AuthCodes:
  get:
    operationId: listAuthCodes
    tags: [auth]
    summary: 当前用户权限码
    description: 权限码与 scope 同源（§13.2）；PoC 阶段返回空数组=不启用按钮级权限。
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: 权限码列表
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/AuthCodesList'
            examples:
              ok:
                summary: 空=全放行
                value: []
      '401':
        $ref: '../components/responses/auth.yaml#/AuthUnauthorized'

AuthLogout:
  post:
    operationId: logoutAuth
    tags: [auth]
    summary: 注销当前会话
    description: PoC 令牌为无状态签名，服务端无可撤销状态；端点仅作前端登出闭环。
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: 已注销
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/AuthLogoutDone'
            examples:
              ok:
                summary: 成功
                value: { ok: true }
