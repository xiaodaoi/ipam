LogExportSettingsCollection:
  get:
    operationId: getLogExportSettings
    tags: [logs]
    summary: 日志外发与采样策略
    description: 读取 Syslog/Kafka/Webhook sink 与采样模式；scope 为 system:read。
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: 当前策略
        content:
          application/json:
            schema:
              $ref: '../components/schemas/logexport.yaml#/LogExportSettings'
  put:
    operationId: updateLogExportSettings
    tags: [logs]
    summary: 保存日志外发与采样策略
    description: |
      保存后重新渲染 Vector 配置并触发热加载；scope 为 system:write。
      抽样/仅异常会影响仓储与所有外发 sink，请评估后再切换。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/logexport.yaml#/LogExportSettings'
    responses:
      '200':
        description: 已保存并渲染
        content:
          application/json:
            schema:
              $ref: '../components/schemas/logexport.yaml#/LogExportSettings'
      '400':
        description: 参数非法
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
