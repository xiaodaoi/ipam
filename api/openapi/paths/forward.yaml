ForwardRulesCollection:
  get:
    operationId: listForwardRules
    tags: [dns]
    summary: 查询条件转发规则
    description: 返回全部转发规则含启用状态；最长后缀优先语义见 FR-B-02。
    security: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas/forward.yaml#/ForwardRuleList'
          examples:
            ok:
              summary: 示例
              value: { items: [{ id: 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', domain: '.', upstreamIds: ['99999999-9999-9999-9999-999999999999'], enabled: true }], total: 1 }
  post:
    operationId: createForwardRule
    tags: [dns]
    summary: 创建条件转发规则（最长后缀优先）
    description: |
      域名后缀与上游绑定；最长后缀优先匹配。dryRun=true 返回将执行的下发命令。
      所需 scope 为 dns.write。支持 Idempotency-Key。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/forward.yaml#/ForwardRuleCreate'
            examples:
                intranet:
                  summary: 内网根域指向内部 DNS
                  value:
                    domain: corp.local.
                    upstreamIds: ["77777777-7777-7777-7777-777777777777"]
                    note: 内网权威域
                dry:
                  summary: dryRun 预览
                  value:
                    domain: office.example.com
                    upstreamIds: ["88888888-8888-8888-8888-888888888888"]
                    dryRun: true
    responses:
      '201':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas/forward.yaml#/ForwardRule'
          examples:
            ok:
              summary: 示例
              value: { id: 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', domain: 'corp.local.', upstreamIds: ['77777777-7777-7777-7777-777777777777'], enabled: true }
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas/forward.yaml#/ForwardRuleDryRun'
          examples:
            ok:
              summary: 示例
              value: { commands: ['unbound-control forward_add corp.local. 10.0.0.53@53'] }
ForwardRuleItem:
  patch:
    operationId: updateForwardRule
    tags: [dns]
    summary: 更新转发规则（重新下发）
    description: 变更上游集合或启停后自动重下发；失败返回 503 UNBOUND_DOWN。所需 scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: ruleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              upstreamIds: { type: array, items: { type: string, format: uuid } }
              enabled: { type: boolean }
              note: { type: string, maxLength: 128 }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas/forward.yaml#/ForwardRule'
          examples:
            ok:
              summary: 示例
              value: { id: 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', domain: 'corp.local.', upstreamIds: ['88888888-8888-8888-8888-888888888888'], enabled: true }
  delete:
    operationId: deleteForwardRule
    tags: [dns]
    summary: 删除转发规则（forward_remove）
    description: 删除后立即从 unbound 摘除对应 forward-zone。所需 scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    x-risk-level: destructive
    parameters:
      - name: ruleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204':
        description: 已删除
