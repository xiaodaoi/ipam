# 账号安全策略（M6-001）：强制改密开关等。system:read 读 / system:write 写。
SecuritySettingsCollection:
  get:
    operationId: getSecuritySettings
    tags: [platform]
    summary: 读取账号安全策略
    description: |
      返回首次登录/管理员重置口令后是否强制修改口令。默认关闭，便于调试与平滑上线；
      开启后仅影响此后的新建账号与重置口令（已登录用户不被强制踢出）。
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: 账号安全策略
        content:
          application/json:
            schema:
              $ref: '../components/schemas/settings.yaml#/SecuritySettings'
            examples:
              default:
                summary: 默认关闭
                value: { forcePasswordChange: false }
      '401':
        $ref: '../components/responses/auth.yaml#/AuthUnauthorized'
  put:
    operationId: updateSecuritySettings
    tags: [platform]
    summary: 更新账号安全策略
    description: 仅 system:write 可写。修改后对新建账号/重置口令立即生效，不影响已有会话。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/settings.yaml#/SecuritySettingsUpdate'
    responses:
      '200':
        description: 更新后的策略
        content:
          application/json:
            schema:
              $ref: '../components/schemas/settings.yaml#/SecuritySettings'
            examples:
              enabled:
                summary: 开启强制改密
                value: { forcePasswordChange: true }
      '400':
        description: 参数非法
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
      '401':
        $ref: '../components/responses/auth.yaml#/AuthUnauthorized'
      '403':
        description: 无 system:write 权限
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Problem'
