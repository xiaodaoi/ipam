# 操作审计端点（M4-003，FR-F 审计、§12.3 人/Bot 调用者区分）

AuditsCollection:
  get:
    operationId: listOperationAudits
    tags: [logs]
    summary: 查询操作审计
    description: |
      管理员操作审计检索（FR-F）：actor 类型/动作/资源子串/时间窗组合过滤，
      游标分页按 (ts DESC, id DESC) 稳定翻页。仅变更类请求（POST/PATCH/DELETE）入库；
      数据源 PostgreSQL operation_audit 表，token 身份在 M5 JWT 接入后填充（§12.3）。
    security: []
    parameters:
      - name: from
        in: query
        required: true
        schema: { type: string, format: date-time }
        description: 时间窗起点（UTC）；窗口上限 31 天
      - name: to
        in: query
        schema: { type: string, format: date-time }
        description: 时间窗终点（UTC，缺省=当前时间）
      - name: actorType
        in: query
        schema: { type: string, enum: [human, bot, system] }
        description: 调用者类型过滤（§12.3）
      - name: action
        in: query
        schema: { type: string }
        description: 动作过滤（create/update/delete…）
      - name: q
        in: query
        schema: { type: string }
        description: 资源/路径子串过滤（不区分大小写）
      - name: cursor
        in: query
        schema: { type: string }
        description: 分页游标（取自上一页 nextCursor）
      - name: pageSize
        in: query
        schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        description: 每页条数
    responses:
      '200':
        description: 审计页
        content:
          application/json:
            schema:
              $ref: '../components/schemas/audit.yaml#/AuditPage'
            examples:
              ok:
                summary: 变更类操作混合页
                value:
                  items:
                    - id: 42
                      ts: "2026-08-27T08:30:00Z"
                      actorType: human
                      actor: admin
                      tokenSub: ""
                      method: POST
                      path: "/api/v1/subnets"
                      action: create
                      resource: "POST /subnets"
                      status: 201
                    - id: 41
                      ts: "2026-08-27T08:28:12Z"
                      actorType: bot
                      actor: ansible-bot
                      tokenSub: "bot:ansible#a1b2c3"
                      method: DELETE
                      path: "/api/v1/upstreams/77777777-7777-7777-7777-777777777777"
                      action: delete
                      resource: "DELETE /upstreams/{upstreamId}"
                      status: 204
                  nextCursor: "1724754492000:41"
                  total: 128
      '400':
        description: 过滤参数非法
        content:
          application/problem+json:
            schema:
              type: object
              required: [type, title, status]
              properties:
                type: { type: string }
                title: { type: string }
                status: { type: integer }
                detail: { type: string }
                code: { type: string }
            examples:
              badWindow:
                summary: 时间窗超限
                value:
                  type: 'https://ipam.local/problems/bad-request'
                  title: Bad Request
                  status: 400
                  detail: 时间窗超过 31 天上限
                  code: INVALID_FILTER
                  instance: '/api/v1/audits'