# 用户与角色端点（M5-004，§13.4 系统管理）

UsersCollection:
  get:
    operationId: listUsers
    tags: [platform]
    summary: 用户列表
    description: 全量用户（不含口令散列）；user 角色可读（按钮级操作由前端按角色收敛）。
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: 用户列表
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user.yaml#/UserList'
            examples:
              ok:
                summary: 单管理员
                value:
                  items:
                    - id: "f0f0f0f0-0000-0000-0000-000000000001"
                      username: admin
                      displayName: 管理员
                      roles: [admin]
                      enabled: true
                      createdAt: "2026-08-28T00:00:00Z"
  post:
    operationId: createUser
    tags: [platform]
    summary: 新建用户
    description: 用户名唯一；口令 bcrypt 落库。所需 scope 为 admin（RBAC 写拦截，M5-003）。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/user.yaml#/UserCreate'
          examples:
            plainUser:
              summary: 只读运维账号
              value:
                username: op01
                displayName: 运维一号
                password: "S3cure-Passw0rd"
                roles: [user]
    responses:
      '201':
        description: 已创建
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user.yaml#/User'
            examples:
              ok:
                summary: 已建只读账号
                value:
                  id: "f0f0f0f0-0000-0000-0000-000000000002"
                  username: op01
                  displayName: 运维一号
                  roles: [user]
                  enabled: true
                  createdAt: "2026-08-28T08:00:00Z"
      '400':
        $ref: '../components/responses/auth.yaml#/AuthUnauthorized'

UserItem:
  patch:
    operationId: updateUser
    tags: [platform]
    summary: 更新用户（重置密码/角色/启停）
    description: |
      PATCH 全部可选。自保护：不能停用/删除自己、不能变更自己角色；
      最后一名启用 admin 的停用或角色摘除被拒（防锁死）。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/user.yaml#/UserUpdate'
          examples:
            resetPassword:
              summary: 重置口令
              value:
                password: "N3w-S3cure-Pass"
    responses:
      '200':
        description: 已更新
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user.yaml#/User'
      '400':
        $ref: '../components/responses/auth.yaml#/AuthUnauthorized'
  delete:
    operationId: deleteUser
    tags: [platform]
    summary: 删除用户
    description: 自保护同 PATCH（不能删自己、不能删最后一名启用 admin）。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204':
        description: 已删除
      '400':
        $ref: '../components/responses/auth.yaml#/AuthUnauthorized'