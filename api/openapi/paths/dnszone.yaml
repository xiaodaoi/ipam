DnsZonesCollection:
  get:
    operationId: listDnsZones
    tags: [dns]
    summary: 查询本地区域
    description: 返回 auth/local 两类区域；记录经各 zone 的 records 端点管理。
    security: []
    responses:
      '200':
        description: 区域列表
        content:
          application/json:
            schema:
              $ref: '../components/schemas/dnszone.yaml#/DnsZoneList'
            examples:
              ok:
                summary: auth 与 local 各一
                value:
                  items:
                    - id: "cccccccc-cccc-cccc-cccc-cccccccccccc"
                      name: corp.local.
                      kind: auth
                      enabled: true
                    - id: "dddddddd-dddd-dddd-dddd-dddddddddddd"
                      name: block.corp.local.
                      kind: local
                      enabled: true
                  total: 2
  post:
    operationId: createDnsZone
    tags: [dns]
    summary: 创建本地区域
    description: 区域名全局唯一（尾点容错）；创建后可添加解析记录。所需 scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/dnszone.yaml#/DnsZoneCreate'
    responses:
      '201':
        description: 已创建
        content:
          application/json:
            schema:
              $ref: '../components/schemas/dnszone.yaml#/DnsZone'
DnsZoneItem:
  get:
    operationId: exportDnsZone
    tags: [dns]
    summary: 导出 zonefile（checkconf 校验过的静态区）
    description: 返回以 ORIGIN 起头的标准 zonefile 文本，供 auth_zone_reload 使用。
    security: []
    parameters:
      - $ref: '../parameters/dnszone.yaml#/ZoneId'
    responses:
      '200':
        description: zonefile 文本
        content:
          text/plain:
            schema:
              type: string
  delete:
    operationId: deleteDnsZone
    tags: [dns]
    summary: 删除区域（级联记录）
    description: 级联删除区域内全部解析记录并刷新 unbound。scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    x-risk-level: destructive
    parameters:
      - $ref: '../parameters/dnszone.yaml#/ZoneId'
    responses:
      '204':
        description: 已删除
  patch:
    operationId: updateDnsZone
    tags: [dns]
    summary: 更新区域（重命名/启停/类型）
    description: 变更后重渲染并 reload 生效。scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '../parameters/dnszone.yaml#/ZoneId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/dnszone.yaml#/DnsZoneUpdate'
    responses:
      '200':
        description: 已更新
        content:
          application/json:
            schema:
              $ref: '../components/schemas/dnszone.yaml#/DnsZone'
      '404':
        description: 区域不存在
        content:
          application/problem+json:
            schema:
              type: object
              required: [type, title, status]
              properties:
                type: { type: string }
                title: { type: string }
                status: { type: integer }
                code: { type: string }

DnsRecordsCollection:
  get:
    operationId: listDnsRecords
    tags: [dns]
    summary: 查询区域记录
    description: 返回该区域全部解析记录，含禁用项，前端可按需过滤展示。
    security: []
    parameters:
      - $ref: '../parameters/dnszone.yaml#/ZoneId'
    responses:
      '200':
        description: 记录列表
        content:
          application/json:
            schema:
              $ref: '../components/schemas/dnszone.yaml#/DnsRecordList'
  post:
    operationId: createDnsRecord
    tags: [dns]
    summary: 创建记录（触发 auth_zone_reload 单区刷新）
    description: 同 zone 内 name 与 type 组合唯一；rdata 按类型校验；创建后单区刷新不动整进程。scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '../parameters/dnszone.yaml#/ZoneId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/dnszone.yaml#/DnsRecordCreate'
    responses:
      '201':
        description: 已创建
        content:
          application/json:
            schema:
              $ref: '../components/schemas/dnszone.yaml#/DnsRecord'
DnsRecordItem:
  parameters:
    - $ref: '../parameters/dnszone.yaml#/ZoneId'
    - $ref: '../parameters/dnszone.yaml#/RecordId'
  delete:
    operationId: deleteDnsRecord
    tags: [dns]
    summary: 删除记录
    description: 删除后重渲染并 reload 生效。scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    responses:
      '204':
        description: 已删除
      '404':
        description: 记录不存在
        content:
          application/problem+json:
            schema:
              type: object
              required: [type, title, status]
              properties:
                type: { type: string }
                title: { type: string }
                status: { type: integer }
                code: { type: string }
  patch:
    operationId: updateDnsRecord
    tags: [dns]
    summary: 更新记录（改名/类型/TTL/值/启停）
    description: rdata 按类型校验；变更后重渲染并 reload 生效。scope 为 dns.write。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/dnszone.yaml#/DnsRecordUpdate'
    responses:
      '200':
        description: 已更新
        content:
          application/json:
            schema:
              $ref: '../components/schemas/dnszone.yaml#/DnsRecord'
      '404':
        description: 记录不存在
        content:
          application/problem+json:
            schema:
              type: object
              required: [type, title, status]
              properties:
                type: { type: string }
                title: { type: string }
                status: { type: integer }
                code: { type: string }

DnsZoneLinked:
  get:
    operationId: listLinkedRecords
    tags: [dns]
    summary: 联动记录（只读）
    description: 返回由 DHCP 双栈联动自动生成的 A 与 AAAA 记录（§4.4），只读不可编辑。
    security: []
    parameters:
      - $ref: '../parameters/dnszone.yaml#/ZoneId'
    responses:
      '200':
        description: 联动记录列表
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '../components/schemas/dnszone.yaml#/LinkedRecord'
              required: [items]