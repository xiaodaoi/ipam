BlocklistsCollection:
  get:
    operationId: listBlocklists
    tags: [blocklist]
    summary: 查询封禁名单库
    description: 返回内置/自定义/订阅三类名单及版本与最近同步时间。
    security: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/BlocklistList'
          examples:
            ok:
              summary: 示例
              value: { items: [{ id: '11111111-2222-3333-4444-555555555555', name: 广告拦截, kind: builtin, version: 42 }], total: 1 }
  post:
    operationId: createBlocklist
    tags: [blocklist]
    summary: 创建名单库
    description: kind=feed 时必须提供 syncUrl；后续经 sync 端点拉取。scope 为 blocklist.write。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blocklist.yaml#/BlocklistCreate'
            examples:
                custom:
                  value: { name: 赌博站, kind: custom }
                feed:
                  value: { name: 恶意域名订阅, kind: feed, syncUrl: "https://example.com/malware.txt" }
    responses:
      '201':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/Blocklist'
          examples:
            ok:
              summary: 示例
              value: { id: '11111111-2222-3333-4444-555555555555', name: 广告拦截, kind: custom, version: 1 }
BlocklistItem:
  post:
    operationId: syncBlocklist
    tags: [blocklist]
    summary: 订阅源同步（失败保留旧版）
    description: |
      仅对 kind=feed 生效：从 syncUrl 拉取域名列表，逐行解析+去重入库，版本+1。
      拉取/解析失败返回 502 且保留旧数据（风险项）。所需 scope 为 blocklist.write。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: listId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/BlocklistSyncResult'
          examples:
            ok:
              summary: 示例
              value: { listId: '33333333-3333-3333-3333-333333333333', version: 8, added: 12, total: 5000 }
      '502':
        description: 订阅源不可达/解析失败（旧版保留）
        content:
          application/problem+json:
            schema:
              type: object
              required: [type, title, status]
              properties:
                type: { type: string }
                title: { type: string }
                status: { type: integer }
                code: { type: string }
  delete:
    operationId: deleteBlocklist
    tags: [blocklist]
    summary: 删除名单（级联删条目）（M2-024）
    description: 删除名单及其全部条目；kind=builtin 内置名单不可删（409）。scope 为 blocklist.write。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: listId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204':
        description: 已删除
      '404':
        description: 名单不存在
      '409':
        description: 内置名单不可删除

BlocklistEntriesCollection:
  get:
    operationId: listBlocklistEntries
    tags: [blocklist]
    summary: 查询名单条目
    description: 支持 pattern 关键字过滤；返回 RPZ 动作与分类标签。
    security: []
    parameters:
      - name: listId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: q
        in: query
        schema: { type: string, maxLength: 128 }
        description: 关键字（pattern 模糊）
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/BlocklistEntryList'
          examples:
            ok:
              summary: 示例
              value: { items: [{ listId: '22222222-2222-2222-2222-222222222222', triggerType: qname, pattern: '*.gamble.com', action: nxdomain }], total: 1 }
  post:
    operationId: addBlocklistEntry
    tags: [blocklist]
    summary: 添加条目
    description: 同名单内 pattern 去重；动作映射见 §5.2。scope 为 blocklist.write。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: listId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blocklist.yaml#/BlocklistEntryCreate'
    responses:
      '201':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/BlocklistEntry'
          examples:
            ok:
              summary: 示例
              value: { listId: '22222222-2222-2222-2222-222222222222', triggerType: qname, pattern: '*.gamble.com', action: nxdomain }
  delete:
    operationId: deleteBlocklistEntry
    tags: [blocklist]
    summary: 删除条目（M2-024）
    description: 按名单+pattern 自然键删除。scope 为 blocklist.write。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: listId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: pattern
        in: query
        required: true
        schema: { type: string, maxLength: 256 }
        description: 条目 pattern（自然键）
    responses:
      '204':
        description: 已删除
      '404':
        description: 条目不存在

PolicyGroupsCollection:
  get:
    operationId: listPolicyGroups
    tags: [blocklist]
    summary: 查询策略分组
    description: 返回 view×网段×名单×时段 的全部策略组（§5.1）。
    security: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/PolicyGroup'
          examples:
            ok:
              summary: 示例
              value: { items: [{ id: '44444444-5555-6666-7777-888888888888', name: 学生分组, viewName: students, cidrs: ['10.61.128.0/17'], listIds: ['11111111-2222-3333-4444-555555555555'] }] }
  post:
    operationId: createPolicyGroup
    tags: [blocklist]
    summary: 创建策略分组（view 唯一）
    description: view_name 全局唯一；创建后调用 compile 生成 RPZ zone。scope 为 blocklist.write。
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blocklist.yaml#/PolicyGroupCreate'
    responses:
      '201':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/PolicyGroup'
          examples:
            ok:
              summary: 示例
              value: { id: '44444444-5555-6666-7777-888888888888', name: 学生分组, viewName: students, cidrs: ['10.61.128.0/17'], listIds: ['11111111-2222-3333-4444-555555555555'] }
PolicyGroupItem:
  post:
    operationId: compilePolicyGroup
    tags: [blocklist]
    summary: 增量编译该分组的 RPZ zone 并单区刷新
    description: |
      仅重写受影响策略组 zonefile（增量，§5.3）；去重后条目→zonefile→auth_zone_reload。
      返回编译结果与重载命令。所需 scope 为 blocklist.write。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/RpzCompileResult'
          examples:
            ok:
              summary: 示例
              value: { zone: students.rpz, entries: 1200, path: '/var/lib/ipam/rpz/students.zone', reloadCommand: 'unbound-control auth_zone_reload students.rpz' }
BlocklistEntryImport:
  post:
    operationId: importBlocklistEntries
    tags: [blocklist]
    summary: CSV 导入条目（M6-023）
    description: |
      正文为 CSV 文本（可选 UTF-8 BOM）：列 `pattern[,action[,category]]`，
      首行可为表头（pattern/action/category 任一出现即视为表头）。action 缺省 nxdomain。
      逐行校验：空行/`#` 注释跳过；非法域名与重复 pattern 计入 skipped。
      replace=true 时先清空该名单现有条目再导入。scope 为 blocklist.write。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: listId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blocklist.yaml#/BlocklistImportRequest'
          examples:
            csv:
              value:
                content: "pattern,action,category\n*.doubleclick.net,nxdomain,ads\nbad.example.com,redirect,gambling"
                replace: false
    responses:
      '200':
        description: 导入结果
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/BlocklistImportResult'
      '400':
        description: CSV 内容为空或格式非法

BlocklistEntryExport:
  get:
    operationId: exportBlocklistEntries
    tags: [blocklist]
    summary: CSV 导出条目（M6-023）
    description: 按 pattern 排序导出 `pattern,action,category`（UTF-8 含 BOM，Excel 可直接打开）。scope 为 blocklist.read。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: listId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: CSV 文本
        content:
          text/csv:
            schema: { type: string }
            examples:
              ok:
                value: "pattern,action,category\n*.doubleclick.net,nxdomain,ads\n"

BlocklistVersionsCollection:
  get:
    operationId: listBlocklistVersions
    tags: [blocklist]
    summary: 名单版本列表（M6-023 回滚基线）
    description: 返回已保存的版本快照（版本号+条目数+时间，倒序），用于回滚。
    security: []
    parameters:
      - name: listId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/BlocklistVersionList'

BlocklistVersionRollback:
  post:
    operationId: rollbackBlocklist
    tags: [blocklist]
    summary: 回滚到指定版本（M6-023）
    description: |
      以指定版本快照替换当前条目，并把版本号 +1（历史不回退，便于再次回滚）。
      快照不存在返回 404。scope 为 blocklist.write。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: listId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    responses:
      '200':
        description: 回滚后的名单
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/Blocklist'
      '404':
        description: 版本不存在

BuiltinPacksCollection:
  get:
    operationId: listBuiltinPacks
    tags: [blocklist]
    summary: 内置分类库目录（M6-023）
    description: 返回随产品分发的内置域名分类包（广告/追踪/赌博/成人/社交），可一键安装为 builtin 名单。
    security: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/BuiltinPackList'

BuiltinPackInstall:
  post:
    operationId: installBuiltinPack
    tags: [blocklist]
    summary: 安装内置分类库（M6-023）
    description: |
      以分类包内容创建一份 kind=builtin 名单（同名重复安装返回 409）。
      安装后条目立即可加入策略组，版本从 1 开始，后续可经版本快照回滚。scope 为 blocklist.write。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string, enum: [ads, trackers, gambling, adult, social] }
    responses:
      '201':
        description: 已安装
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/Blocklist'
      '404':
        description: 分类包不存在
      '409':
        description: 同名单已存在
