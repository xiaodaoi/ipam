BlocklistsCollection:
  get:
    operationId: listBlocklists
    tags: [blocklist]
    summary: 查询封禁名单库
    security: []
    responses:
      '200':
        description: 名单列表
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/BlocklistList'
          examples:
            ok:
              summary: 内置+自定义+订阅
              value:
                items:
                  - { id: "11111111-2222-3333-4444-555555555555", name: 广告拦截, kind: builtin, version: 42 }
                  - { id: "22222222-2222-2222-2222-222222222222", name: 赌博站, kind: custom, version: 1 }
                  - { id: "33333333-3333-3333-3333-333333333333", name: 恶意域名订阅, kind: feed, syncUrl: "https://example.com/malware.txt", version: 7 }
                total: 3
  post:
    operationId: createBlocklist
    tags: [blocklist]
    summary: 创建名单库
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blocklist.yaml#/BlocklistCreate'
          examples:
            custom:
              value: { name: 赌博站, kind: custom }
            feed:
              value: { name: 恶意域名订阅, kind: feed, syncUrl: "https://example.com/malware.txt" }
    responses:
      '201':
        description: 已创建
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/Blocklist'

BlocklistItem:
  post:
    operationId: syncBlocklist
    tags: [blocklist]
    summary: 订阅源同步（失败保留旧版）
    description: |
      kind=feed 时从 syncUrl 拉取域名列表；逐行解析+去重入库；版本+1。
      拉取/解析失败返回 502 且保留旧数据（K 风险项）。
      所需 scope 为 blocklist.write。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: listId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: 同步完成
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/BlocklistSyncResult'
      '502':
        description: 订阅源不可达/解析失败（旧版保留）
        content:
          application/problem+json:
            schema:
              type: object
              required: [type, title, status]
              properties:
                type: { type: string }
                title: { type: string }
                status: { type: integer }
                code: { type: string }
          examples:
            feedDown:
              value:
                type: "https://ipam.local/problems/feed-down"
                title: Bad Gateway
                status: 502
                code: FEED_DOWN

BlocklistEntriesCollection:
  get:
    operationId: listBlocklistEntries
    tags: [blocklist]
    summary: 查询名单条目
    security: []
    parameters:
      - name: listId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: q
        in: query
        schema: { type: string, maxLength: 128 }
        description: 关键字（pattern 模糊）
    responses:
      '200':
        description: 条目列表
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/BlocklistEntryList'
          examples:
            ok:
              summary: qname 触发器两例
              value:
                items:
                  - { listId: "22222222-2222-2222-2222-222222222222", triggerType: qname, pattern: "*.gamble.com", action: nxdomain, category: 赌博 }
                  - { listId: "22222222-2222-2222-2222-222222222222", triggerType: qname, pattern: "block.corp.local.", action: redirect, redirectTarget: "block.corp.local.", category: 提示页 }
                total: 2
  post:
    operationId: addBlocklistEntry
    tags: [blocklist]
    summary: 添加条目
    security: [{ bearerAuth: [] }]
    parameters:
      - name: listId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blocklist.yaml#/BlocklistEntryCreate'
          examples:
            nxdomain:
              value: { triggerType: qname, pattern: "*.gamble.com", action: nxdomain, category: 赌博 }
            redirect:
              value: { triggerType: qname, pattern: "block.corp.local.", action: redirect, redirectTarget: "block.corp.local.", category: 提示页 }
    responses:
      '201':
        description: 已添加
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/BlocklistEntry'

PolicyGroupsCollection:
  get:
    operationId: listPolicyGroups
    tags: [blocklist]
    summary: 查询策略分组
    security: []
    responses:
      '200':
        description: 分组列表
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '../components/schemas/blocklist.yaml#/PolicyGroup'
              required: [items]
          examples:
            ok:
              summary: 学生网段
              value:
                items:
                  - { id: "44444444-5555-6666-7777-888888888888", name: 学生分组, viewName: students, cidrs: ["10.61.128.0/17"], listIds: ["11111111-2222-3333-4444-555555555555"] }
  post:
    operationId: createPolicyGroup
    tags: [blocklist]
    summary: 创建策略分组（view 唯一）
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blocklist.yaml#/PolicyGroupCreate'
          examples:
            students:
              value: { name: 学生分组, viewName: students, cidrs: ["10.61.128.0/17"], listIds: ["11111111-2222-3333-4444-555555555555"] }
    responses:
      '201':
        description: 已创建
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/PolicyGroup'

PolicyGroupItem:
  post:
    operationId: compilePolicyGroup
    tags: [blocklist]
    summary: 增量编译该分组的 RPZ zone 并单区刷新
    description: |
      仅重写受影响策略组 zonefile（增量，§5.3）；去重后条目→zonefile→auth_zone_reload。
      返回编译结果与重载命令。所需 scope 为 blocklist.write。
    security: [{ bearerAuth: [] }]
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: 编译完成
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blocklist.yaml#/RpzCompileResult'
