    Problem:
      type: object
      description: RFC 9457 问题详情。type/code 字段供机器判读，AI agent 可据此自纠重试（§12.2 约定 4）。
      required: [type, title, status]
      properties:
        type:
          type: string
          description: 问题类型 URI，稳定不变供程序匹配
        title:
          type: string
          description: 人类可读摘要
        status:
          type: integer
          description: HTTP 状态码
        detail:
          type: string
          description: 具体原因说明（不含敏感信息）
        code:
          type: string
          description: 业务错误码（如 PLATFORM_DB_DOWN），枚举随端点文档化
        instance:
          type: string
          description: 出错请求的路径
  parameters:
    OrgId:
      $ref: './parameters/org.yaml#/OrgId'
    SubnetId:
      $ref: './parameters/subnet.yaml#/SubnetIdParam'
  responses:
    Problem:
      description: 错误响应（RFC 9457 Problem Details）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internalError:
              summary: 内部错误典型样例
              value:
                type: 'https://ipam.local/problems/internal'
                title: Internal Server Error
                status: 500
                detail: 数据库暂不可用
                code: PLATFORM_DB_DOWN
                instance: /api/v1/system/info
