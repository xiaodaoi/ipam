  /ledger:
    $ref: './paths/ledger.yaml#/LedgerCollection'
  /ledger/bind:
    $ref: './paths/ledger.yaml#/BindStatic'
  /subnets:
    $ref: './paths/subnets.yaml#/SubnetsCollection'
  /subnets/{subnetId}:
    $ref: './paths/subnets.yaml#/SubnetItem'
  /orgs:
    $ref: './paths/orgs.yaml#/OrgsCollection'
  /orgs/{orgId}:
    $ref: './paths/orgs.yaml#/OrgItem'
  /system/info:
    get:
      operationId: getSystemInfo
      tags: [platform]
      summary: 查询控制面系统信息
      description: |
        返回控制面版本、运行时与就绪状态。
        用途：仪表盘「服务健康」卡片数据源与负载均衡探活。
        所需权限：匿名可读（登录页即需探活）；管理类端点默认 bearerAuth。
      security: []
      responses:
        '200':
          description: 系统信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
              examples:
                ok:
                  summary: 正常运行
                  value:
                    name: ipam-control-plane
                    version: 0.1.0-dev
                    goVersion: go1.27.0
                    now: '2026-08-25T08:00:00Z'
                    ready: true
        '500':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录颁发的访问令牌；权限 scope 与前端按钮权限码同源定义（§13.2）。
  schemas:
    SystemInfo:
      type: object
      required: [name, version, goVersion, now, ready]
      properties:
        name:
          type: string
          description: 服务标识，固定值 ipam-control-plane
        version:
          type: string
          description: 语义化版本号，构建期经 ldflags 注入
        goVersion:
          type: string
          description: 编译所用 Go 运行时版本（runtime.Version()）
        now:
          type: string
          format: date-time
          description: 服务端当前时间（UTC，RFC3339）
        ready:
          type: boolean
          description: 关键依赖（PostgreSQL）可达则为 true；false 时仪表盘服务健康亮黄
    OrgNode:
      $ref: './components/schemas/org.yaml#/OrgNode'
    OrgTreeNode:
      $ref: './components/schemas/org.yaml#/OrgTreeNode'
    OrgCreate:
      $ref: './components/schemas/org.yaml#/OrgCreate'
    OrgUpdate:
      $ref: './components/schemas/org.yaml#/OrgUpdate'
    Subnet:
