openapi: 3.1.0
info:
  title: IPAM Control Plane API
  version: 0.1.0
  description: |
    IPAM 一体化产品控制面 REST API（唯一事实源，D14 Spec-First）。

    规范要点（架构文档 §12）：operationId 即 AI 工具名，发布后不可改；
    错误模型统一 RFC 9457 Problem；每个 operation 必含描述与成功/错误双示例；
    写操作支持 dry_run 预检与 Idempotency-Key 幂等头。
servers:
  - url: /api/v1
tags:
  - name: platform
    description: 平台能力（系统信息/健康/认证/审计/用户与角色）
  - name: org
    description: 组织分组主数据（多级自定义树，§13.4）
  - name: subnet
    description: DHCPv4/v6 子网与地址池（FR-C、§13.4）
  - name: ledger
    description: 地址台账（六态矩阵与保留/绑定操作，§13.4）
  - name: asset
    description: 资产登记（MAC 身份键，§13.4）
  - name: reservation
    description: 保留与静态绑定批量管理（FR-A-04、§13.4）
  - name: dns
    description: DNS 服务（上游/转发/解析记录/封禁，FR-B、§13.4）
  - name: blocklist
    description: DNS 封禁管控（RPZ 名单/策略分组/订阅源，FR-B-11~18、D13）
  - name: logs
    description: 日志中心检索（组合过滤/TopN/QPS 曲线/CSV 导出，FR-E-04、§6）
  - name: dashboard
    description: 仪表盘聚合快照（一级菜单 F-01、§13.4）
  - name: dualstack
    description: DHCP 双栈绑定模板（v4↔v6 池映射，§4.3）
  - name: dhcp
    description: DHCP 选项与类匹配（C-02/C-03，§13.4 DHCP 菜单 5/6）
  - name: auth
    description: 认证与会话（M5-001 PoC 直通；正式 JWT 见 M5-002、§12.3）
