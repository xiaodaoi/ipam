IntelWhitelist:
  type: object
  description: 拦截白名单（RPZ passthru，M6-038）。
  required: [id, kind, value, reason, enabled]
  properties:
    id: { type: string, format: uuid }
    kind: { type: string, enum: [qname, suffix], description: qname=仅该名；suffix=该域及子域 }
    value: { type: string, description: 域名（不含通配前缀） }
    reason: { type: string, description: 豁免原因（必填，审计用） }
    category: { type: string, nullable: true }
    source: { type: string, description: 'manual | builtin | feed_exclude | auto_fp' }
    expiresAt: { type: string, format: date-time, nullable: true, description: 到期后自动失效 }
    enabled: { type: boolean }
    createdBy: { type: string }
    createdAt: { type: string, format: date-time }

IntelWhitelistCreate:
  type: object
  required: [value, reason]
  properties:
    kind: { type: string, enum: [qname, suffix], default: qname }
    value: { type: string }
    reason: { type: string }
    category: { type: string, nullable: true }
    expiresAt: { type: string, format: date-time, nullable: true }

IntelWhitelistList:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: 'intel.yaml#/IntelWhitelist' } }
    total: { type: integer }

IntelZone:
  type: object
  description: RPZ 区运行态快照。
  required: [zone, entries, serial, status]
  properties:
    zone: { type: string }
    entries: { type: integer, description: 去重后的域名条目数 }
    serial: { type: integer, description: 编译写入的 SOA serial }
    loadedSerial: { type: integer, description: list_auth_zones 观测到的运行态 serial }
    sha256: { type: string }
    path: { type: string }
    status: { type: string, enum: [empty, loaded, stale, failed] }
    updatedAt: { type: string, format: date-time }

IntelZoneList:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: 'intel.yaml#/IntelZone' } }
    total: { type: integer }

IntelCompileResult:
  type: object
  required: [zones, entries]
  properties:
    zones: { type: array, items: { $ref: 'intel.yaml#/IntelZone' } }
    entries: { type: integer, description: 自定义封禁条目数 }
    reloaded: { type: array, items: { type: string }, description: 本次实际热载的区名 }

IntelSource:
  type: object
  description: 情报源（M6-039）。默认关闭，启用需确认许可。
  required: [id, key, name, kind, layer, enabled, updateInterval]
  properties:
    id: { type: string, format: uuid }
    key: { type: string, description: 预设键或 custom:<uuid> }
    name: { type: string }
    kind: { type: string, enum: [preset, custom] }
    layer: { type: string, enum: [hot, broad], description: hot ≤10 万 / broad ≤30 万 }
    url: { type: string }
    format: { type: string, description: 解析格式（当前统一 auto 识别） }
    authHeader: { type: string, description: 鉴权头名，如 Auth-Key；为空表示匿名拉取 }
    hasSecret: { type: boolean, description: 是否已写入密钥（内容不回传） }
    license: { type: string }
    licenseUrl: { type: string }
    commercialOk: { type: boolean, description: 许可是否允许商用 }
    requiresAck: { type: boolean }
    acknowledgedAt: { type: string, format: date-time, nullable: true }
    updateInterval: { type: integer, description: 刷新间隔（秒） }
    maxSharePct:
      type: integer
      minimum: 0
      maximum: 100
      description: 单源在所在层的贡献上限（百分比）。仅同层有多个源且总需求超过容量时生效；0=不限。默认 60。
    enabled: { type: boolean }
    entries: { type: integer, description: 最近一次成功同步的条目数 }
    lastSyncAt: { type: string, format: date-time, nullable: true }
    lastStatus: { type: string, enum: [never, ok, failed] }
    lastError: { type: string }
    lastDurationMs: { type: integer, description: 最近一次同步耗时（毫秒） }
    lastAdded: { type: integer, description: 最近一次同步新增条目数 }
    lastRemoved: { type: integer, description: 最近一次同步移除条目数 }
    lastExcluded: { type: integer, description: 最近一次同步中被白名单排除的条目数 }
    builtin: { type: boolean, description: 预设不可删除 }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }

IntelSourceList:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: 'intel.yaml#/IntelSource' } }
    total: { type: integer }

IntelSourceCreate:
  type: object
  required: [name, url]
  properties:
    name: { type: string }
    url: { type: string }
    layer: { type: string, enum: [hot, broad], default: hot }
    updateInterval: { type: integer, description: 秒；默认 21600 }
    maxSharePct: { type: integer, minimum: 0, maximum: 100, description: 单源贡献上限（百分比；0=不限，默认 60） }
    license: { type: string, nullable: true }

IntelSourceUpdate:
  type: object
  properties:
    name: { type: string }
    url: { type: string }
    layer: { type: string, enum: [hot, broad] }
    authHeader: { type: string, nullable: true }
    secret: { type: string, nullable: true, description: 明文密钥，写入 0600 文件后丢弃，不入库 }
    clearSecret: { type: boolean }
    updateInterval: { type: integer }
    maxSharePct: { type: integer, minimum: 0, maximum: 100, description: 单源贡献上限（百分比；0=不限） }
    enabled: { type: boolean }
    ackLicense: { type: boolean, description: 启用时必须为 true（确认许可与商用限制） }

IntelSourceRun:
  type: object
  description: 情报源一次同步/回滚执行记录（M6-039 P2）。
  required: [id, sourceId, startedAt, status, trigger, entries]
  properties:
    id: { type: integer, format: int64 }
    sourceId: { type: string, format: uuid }
    startedAt: { type: string, format: date-time }
    durationMs: { type: integer, description: 耗时（毫秒） }
    status: { type: string, enum: [ok, failed, rolled_back] }
    trigger: { type: string, enum: [manual, schedule, enable, rollback] }
    entries: { type: integer, description: 本次执行后的条目数（失败时为上一版条目数） }
    added: { type: integer }
    removed: { type: integer }
    excluded: { type: integer, description: 被白名单排除的条目数 }
    revision: { type: integer, description: 本次生成的版本号；0 表示内容未变化 }
    error: { type: string }

IntelSourceRunList:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: 'intel.yaml#/IntelSourceRun' } }
    total: { type: integer }

IntelSourceRevision:
  type: object
  description: 情报源内容版本（按成功同步的差异快照保存，可一键回滚）。
  required: [id, sourceId, revision, entries, createdAt, active]
  properties:
    id: { type: integer, format: int64 }
    sourceId: { type: string, format: uuid }
    revision: { type: integer, description: 版本号（同一源内单调递增） }
    entries: { type: integer }
    sha256: { type: string }
    active: { type: boolean, description: 是否为当前生效版本 }
    createdAt: { type: string, format: date-time }

IntelSourceRevisionList:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: 'intel.yaml#/IntelSourceRevision' } }
    total: { type: integer }
