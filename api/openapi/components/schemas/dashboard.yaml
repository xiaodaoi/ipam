# 仪表盘聚合契约（M4-004，F-01、§13.4 一级菜单）

DashboardOverview:
  type: object
  required: [ts, onlineNow, onlineV4, onlineV6, onlineTrend, services]
  properties:
    ts:
      type: string
      format: date-time
      description: 快照生成时间（UTC）
    todayStart:
      type: string
      format: date-time
      description: 「今日」口径起点（UTC 当日 00:00）
    onlineNow:
      type: integer
      description: 当前在线租约地址数（有效租约口径：active/grace 绑定且落在已配置子网内；与 DHCP 子网页「在线租约」一致，双栈按地址计数）
    onlineV4:
      type: integer
      description: 当前在线租约 IPv4 地址数（等于 DHCP 子网页 family=4 在线租约总数）
    onlineV6:
      type: integer
      description: 当前在线租约 IPv6 地址数（等于 DHCP 子网页 family=6 在线租约总数）
    onlineTrend:
      type: array
      description: 近 24 小时 DHCP 活跃地址趋势（日志口径，逐小时去重；与当前在线租约口径不同，页面需注明）
      items:
        type: object
        required: [ts, count]
        properties:
          ts: { type: string, format: date-time }
          count: { type: integer }
    newTerminals:
      type: integer
      nullable: true
      description: 今日新增 MAC（近 7 天窗口内首见日=今日）；无数据源时 null
    offlineTerminals:
      type: integer
      nullable: true
      description: 离线终端（前 24h 有活动、今日未见）
    services:
      type: object
      required: [postgres, clickhouse, kea, unbound]
      properties:
        postgres: { $ref: 'dashboard.yaml#/HealthLight' }
        clickhouse: { $ref: 'dashboard.yaml#/HealthLight' }
        kea: { $ref: 'dashboard.yaml#/HealthLight' }
        unbound: { $ref: 'dashboard.yaml#/HealthLight' }
    dns:
      type: object
      properties:
        qps5m:
          type: number
          nullable: true
          description: 近 5 分钟 DNS QPS（计数/300 秒）
        hitRatePct:
          type: integer
          nullable: true
          description: 缓存命中率（unbound 未输出命中语义日志前恒为 null，§6 遗留②）
        blockedToday:
          type: integer
          nullable: true
          description: 今日拦截量（action=blocked；vector 归一化增强 M4-001 遗留② 前为 0/null）
    poolUtilTop:
      type: array
      maxItems: 5
      description: 池利用率 Top5（used=当前池内在线租约地址数，与 DHCP 子网页一致；capacity=区间地址数）
      items:
        $ref: 'dashboard.yaml#/PoolUtilization'
    coherenceSuccessRatePct:
      type: integer
      nullable: true
      description: 双栈联动成功率（active/(active+conflict) ×100；绑定仓储不可用时 null）

HealthLight:
  type: string
  enum: [up, down, unknown]
  description: 服务健康灯（unknown=未配置探测地址或 PoC 模式）

PoolUtilization:
  type: object
  required: [subnetId, name, cidr, poolIndex, used, capacity, pct]
  properties:
    subnetId: { type: string, format: uuid }
    name: { type: string }
    cidr: { type: string, description: 所属子网 CIDR }
    orgId: { type: string, description: 所属组织（部门）ID }
    orgName: { type: string, description: 所属组织（部门）名称；组织缺失时为空 }
    poolIndex: { type: string, description: 池序号（0 起） }
    used: { type: integer, description: 当前池内在线租约地址数（与 DHCP 子网页同口径） }
    capacity: { type: integer, description: 池区间容量（/127+ 大段按 uint64 饱和展示） }
    pct:
      type: number
      description: 利用率百分比（capacity=0 时 0）