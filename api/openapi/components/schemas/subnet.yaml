Subnet:
  type: object
  description: 子网（IPv4/IPv6，挂组织树；FR-C、§13.4）。
  required: [id, orgId, name, family, cidr, pools]
  properties:
    id:
      type: string
      format: uuid
    orgId:
      type: string
      format: uuid
      description: 所属组织节点（组织→子网→租约/台账关联链起点）
    name:
      type: string
      maxLength: 64
    family:
      type: integer
      enum: [4, 6]
    cidr:
      type: string
      description: 如 10.61.172.0/24 或 2406:172::/64（掩码由 CIDR 隐含）
    gateway:
      type: string
      description: 网关（v4 option routers；v6 留空——v6 网关走 RA）
    dnsServers:
      type: string
      description: DNS 服务器（逗号分隔；v4 domain-name-servers / v6 dns-servers）
    pools:
      type: array
      items:
        $ref: 'subnet.yaml#/AddressPool'
    keaSubnetId:
      type: [integer, "null"]
      description: 下发 Kea 后的 subnet-id（引擎回写）
    description:
      type: string

AddressPool:
  type: object
  required: [startAddr, endAddr]
  properties:
    startAddr:
      type: string
      description: dynamic=池起址；pd=委派前缀起始
    endAddr:
      type: string
      description: dynamic=池止址；pd=由后端推导（prefix+prefix-len 范围尾）
    kind:
      type: string
      enum: [dynamic, pd, excluded]
      default: dynamic
      description: excluded=保留段（§13.4 冻结不下发）
    prefixLen:
      type: integer
      minimum: 1
      maximum: 128
      description: PD 池前缀长度（kind=pd 必填，如 48）
    delegatedLen:
      type: integer
      minimum: 1
      maximum: 128
      description: PD 委派前缀长度（kind=pd 必填，如 64，≥prefixLen）

SubnetCreate:
  type: object
  required: [orgId, name, family, cidr]
  properties:
    gateway:
      type: string
      description: 网关（v4 option routers；v6 留空）
    dnsServers:
      type: string
      description: DNS 服务器（逗号分隔；v4 domain-name-servers / v6 dns-servers）
    orgId: { type: string, format: uuid }
    name: { type: string, maxLength: 64 }
    family: { type: integer, enum: [4, 6] }
    cidr: { type: string }
    pools:
      type: array
      items:
        $ref: 'subnet.yaml#/AddressPool'
    dryRun:
      type: boolean
      default: false
      description: true 时仅生成并校验 Kea 配置，不实际下发（§12.2 约定 5）
    description: { type: string }

SubnetUpdate:
  type: object
  properties:
    gateway:
      type: string
      description: 网关（v4；v6 留空）
    dnsServers:
      type: string
      description: DNS 服务器（逗号分隔）
    name: { type: string, maxLength: 64 }
    pools:
      type: array
      items:
        $ref: 'subnet.yaml#/AddressPool'
    description: { type: string }

SubnetList:
  type: object
  description: 列表（可按组织/族过滤）
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: 'subnet.yaml#/Subnet'
    total:
      type: integer
