# 认证组件（M5-001 PoC 直通；正式 JWT 见 M5-002、§12.3）

AuthLoginResult:
  type: object
  required: [accessToken, refreshToken, mustChangePassword]
  properties:
    accessToken:
      type: string
      description: 访问令牌（HS256 JWT，24h TTL，M5-002）
    refreshToken:
      type: string
      description: 刷新令牌（HS256 JWT，kind=refresh，uid+jti+exp，7d TTL，M5-032）
    mustChangePassword:
      type: boolean
      description: true=系统已开启强制改密且该账号被标记（首次登录/管理员重置）；前端据此弹出不可关闭的改密弹窗。默认策略关闭

AuthRefreshRequest:
  type: object
  properties:
    refreshToken:
      type: string
      description: |
        刷新令牌（登录时颁发）。缺省/为空时降级校验 Authorization Bearer 访问令牌
        （过期访问令牌在过期后 7 天宽限窗口内仍可换发，M5-032）。

AuthRefreshResult:
  type: object
  required: [accessToken, refreshToken]
  properties:
    accessToken:
      type: string
      description: 新访问令牌（24h TTL）
    refreshToken:
      type: string
      description: 新刷新令牌（7d TTL；旧刷新令牌 jti 已轮换入黑名单）

AuthChangePasswordRequest:
  type: object
  required: [oldPassword, newPassword]
  properties:
    oldPassword:
      type: string
      description: 当前口令（用于确认身份；错误返回 401）
    newPassword:
      type: string
      minLength: 10
      maxLength: 128
      description: |
        新口令。策略：10–128 位，至少包含小写/大写/数字/符号中的 3 类，
        不得包含用户名，且不得与旧口令相同（M6-001）。

AuthLogoutRequest:
  type: object
  properties:
    refreshToken:
      type: string
      description: 随登出一并吊销的刷新令牌（M5-032：登出同时吊销访问/刷新双令牌 jti）

AuthLoginRequest:
  type: object
  required: [username, password]
  properties:
    username:
      type: string
      description: 账号（PoC 仅 admin）
    password:
      type: string
      description: 登录口令（bcrypt 校验；首次启动随机生成，必须修改后才能继续使用）

UserInfo:
  type: object
  required: [userId, username, realName, roles, homePath, mustChangePassword]
  properties:
    userId:
      type: string
    username:
      type: string
    realName:
      type: string
      description: 昵称
    avatar:
      type: string
      description: 头像 URL（PoC 返回空串）
    roles:
      type: array
      items: { type: string }
      description: 角色码（PoC 固定 ['admin']）
    permissions:
      type: array
      items: { type: string }
      description: 权限点集合（M2-035：域:read|write，前端菜单过滤用）
    desc:
      type: string
    homePath:
      type: string
      description: 登录后默认跳转（仪表盘总览 /overview）
    mustChangePassword:
      type: boolean
      description: 当前是否需强制修改口令（M6-001：系统策略开启且账号被标记时为 true）
    token:
      type: string

AuthCodesList:
  type: array
  items: { type: string }
  description: 权限码集合（与 OpenAPI scope 同源预留；PoC 空=按钮级权限不启用）

AuthLogoutDone:
  type: object
  properties:
    ok:
      type: boolean