Upstream:
  type: object
  description: DNS 上游服务器（FR-B-01；探活状态灯数据源 F-R4）。
  required: [id, name, addrs, protocol, weight, isDefault, enabled, health]
  properties:
    id: { type: string, format: uuid }
    name: { type: string, maxLength: 64 }
    addrs:
      type: array
      items: { type: string, description: "ip[:port]，默认 53" }
      minItems: 1
    protocol: { type: string, enum: [udp, tcp, dot] }
    tlsName:
      type: string
      description: DoT 上游 TLS SNI/证书名（如 cloudflare-dns.com；protocol=dot 时生效，M6-023）
    weight:
      type: integer
      minimum: 0
      description: 预留字段，当前不参与 unbound 选路（unbound 按 infra-cache RTT 自行选择地址）
    isDefault:
      type: boolean
      description: 默认公网出口；所有 enabled 且 isDefault 的上游地址会一起下发到 forward-zone "."。仅允许公网地址，内网 DNS 不得标记
    enabled: { type: boolean }
    health:
      type: object
      description: 探活状态（prober 维护；仅用于展示，不改变转发选路）
      properties:
        up: { type: boolean }
        rttMs: { type: integer }
        consecutiveFails: { type: integer }
        lastCheck: { type: string, format: date-time }

UpstreamCreate:
  type: object
  required: [name, addrs]
  properties:
    name: { type: string, maxLength: 64 }
    addrs:
      type: array
      items: { type: string }
      minItems: 1
    protocol: { type: string, enum: [udp, tcp, dot], default: udp }
    tlsName: { type: string, description: DoT TLS SNI/证书名（protocol=dot 时生效） }
    weight:
      type: integer
      minimum: 0
      default: 1
      description: 预留字段，当前不参与 unbound 选路
    isDefault:
      type: boolean
      default: false
      description: 默认公网出口；标记后参与 forward-zone "."。地址必须全部为公网地址
    enabled: { type: boolean, default: true }

UpstreamUpdate:
  type: object
  properties:
    name: { type: string, maxLength: 64 }
    addrs: { type: array, items: { type: string }, minItems: 1 }
    protocol: { type: string, enum: [udp, tcp, dot] }
    tlsName: { type: string, description: DoT TLS SNI/证书名 }
    weight:
      type: integer
      minimum: 0
      description: 预留字段，当前不参与 unbound 选路
    isDefault:
      type: boolean
      description: 默认公网出口；地址必须全部为公网地址
    enabled: { type: boolean }

UpstreamList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: 'upstream.yaml#/Upstream'
    total: { type: integer }
