Blocklist:
  type: object
  description: 封禁名单库（内置/自定义/订阅源，FR-B-11~14、D13）。
  required: [id, name, kind, version]
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    kind: { type: string, enum: [builtin, custom, feed] }
    syncUrl: { type: string, nullable: true, description: kind=feed 的订阅地址(HTTP) }
    lastSync: { type: string, format: date-time, nullable: true }
    version: { type: integer, description: 版本号（每次同步+1，回滚用） }

BlocklistCreate:
  type: object
  required: [name]
  properties:
    name: { type: string }
    kind: { type: string, enum: [builtin, custom, feed], default: custom }
    syncUrl: { type: string, nullable: true }

BlocklistEntry:
  type: object
  description: 名单条目（RPZ 语义）。
  required: [listId, triggerType, pattern, action]
  properties:
    listId: { type: string, format: uuid }
    triggerType: { type: string, enum: [qname, response_ip] }
    pattern: { type: string, description: "域名（*.bad.com 通配）或 CIDR" }
    action: { type: string, enum: [nxdomain, drop, tcp_only, redirect], default: nxdomain }
    redirectTarget: { type: string, nullable: true, description: action=redirect 的提示页记录名 }
    category: { type: string, description: 拦截报表分类标签 }

BlocklistEntryCreate:
  type: object
  required: [triggerType, pattern, action]
  properties:
    triggerType: { type: string, enum: [qname, response_ip] }
    pattern: { type: string }
    action: { type: string, enum: [nxdomain, drop, tcp_only, redirect] }
    redirectTarget: { type: string, nullable: true }
    category: { type: string }

BlocklistSyncResult:
  type: object
  description: 订阅源同步结果。
  required: [listId, version, added, total]
  properties:
    listId: { type: string, format: uuid }
    version: { type: integer }
    added: { type: integer, description: 本次新增去重后条数 }
    total: { type: integer, description: 同步后库内条数 }

BlocklistList:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: 'blocklist.yaml#/Blocklist' } }
    total: { type: integer }

BlocklistEntryList:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: 'blocklist.yaml#/BlocklistEntry' } }
    total: { type: integer }

PolicyGroup:
  type: object
  description: 封禁策略分组（view×网段×名单×时段，FR-B-15/16、§5.1）。
  required: [id, name, viewName, cidrs, listIds]
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    viewName: { type: string, description: 对应 unbound view 名（唯一） }
    cidrs: { type: array, items: { type: string }, description: 匹配来源网段 }
    listIds: { type: array, items: { type: string, format: uuid }, description: 生效名单集合(白单优先) }
    schedule: { $ref: 'blocklist.yaml#/PolicySchedule' }

PolicyGroupCreate:
  type: object
  required: [name, viewName, cidrs, listIds]
  properties:
    name: { type: string }
    viewName: { type: string }
    cidrs: { type: array, items: { type: string } }
    listIds: { type: array, items: { type: string, format: uuid } }
    schedule: { $ref: 'blocklist.yaml#/PolicySchedule' }

RpzCompileResult:
  type: object
  description: RPZ 增量编译结果。
  required: [zone, entries, path, reloadCommand]
  properties:
    zone: { type: string, description: rpz zone 名（view_name.rpz） }
    entries: { type: integer, description: 去重后条目数 }
    path: { type: string, description: zonefile 路径 }
    reloadCommand: { type: string, description: 如 unbound-control auth_zone_reload students.rpz }

PolicySchedule:
  type: object
  nullable: true
  description: |
    策略生效时段（M6-009B2）。空/未设置=全天生效；days 为空=每天；start>end 表示跨零点
    （如 22:00→06:00）。由控制面每分钟收敛一次，窗口外自动撤销该组的拦截条目。
  properties:
    days:
      type: array
      items: { type: integer, minimum: 0, maximum: 6 }
      description: 生效星期（0=周日 … 6=周六）；空=每天
    start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 起始 HH:MM }
    end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 结束 HH:MM }

BlocklistImportRequest:
  type: object
  required: [content]
  properties:
    content:
      type: string
      maxLength: 1048576
      description: CSV 文本（pattern[,action[,category]]，支持 UTF-8 BOM 与 # 注释）
    replace:
      type: boolean
      default: false
      description: true=导入前清空该名单现有条目

BlocklistImportResult:
  type: object
  required: [created, skipped, total]
  properties:
    created: { type: integer, description: 新增/覆盖条目数 }
    skipped: { type: integer, description: 非法或重复条目数 }
    total: { type: integer, description: 导入后名单条目总数 }
    errors:
      type: array
      items: { type: string }
      description: 前 20 条跳过原因（便于定位）

BlocklistVersion:
  type: object
  required: [version, entries, createdAt]
  properties:
    version: { type: integer }
    entries: { type: integer, description: 该版本快照条目数 }
    createdAt: { type: string, format: date-time }

BlocklistVersionList:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: 'blocklist.yaml#/BlocklistVersion' } }

BuiltinPack:
  type: object
  required: [key, name, entryCount]
  properties:
    key: { type: string }
    name: { type: string }
    description: { type: string }
    categories:
      type: array
      items: { type: string }
    entryCount: { type: integer }

BuiltinPackList:
  type: object
  required: [items]
  properties:
    items: { type: array, items: { $ref: 'blocklist.yaml#/BuiltinPack' } }
