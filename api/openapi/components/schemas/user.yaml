# 用户与角色 schema（M5-004，§13.4 系统管理；角色对齐 M5-003 RBAC admin/user 两级）

User:
  type: object
  required: [id, username, displayName, roles, enabled, createdAt, mustChangePassword]
  properties:
    id: { type: string, format: uuid }
    username:
      type: string
      description: 登录名（唯一）
    displayName:
      type: string
      description: 显示名
    roles:
      type: array
      items: { type: string }
      description: 角色名（内置 admin/operator/auditor/user 或自定义角色；权限取并集）
    enabled:
      type: boolean
      description: 启停（禁用即拒绝登录）
    createdAt:
      type: string
      format: date-time
    mustChangePassword:
      type: boolean
      description: 是否被标记为需改密（M6-001：系统策略开启时新建/重置为 true；实际是否强制由全局策略决定）
    totpEnabled:
      type: boolean
      description: 是否启用 TOTP 双因素认证（M6-007）
    authSource:
      type: string
      enum: [local, ldap]
      description: 认证来源（M6-007B）；ldap 账号口令由目录服务管理，本地改密被拒绝

UserList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: 'user.yaml#/User'

UserCreate:
  type: object
  required: [password, username]
  properties:
    username:
      type: string
      maxLength: 64
      minLength: 2
      pattern: '^[a-zA-Z0-9_.-]+$'
      description: 登录名（唯一，字母数字与 _.- ）
    displayName:
      type: string
      maxLength: 64
    password:
      type: string
      maxLength: 128
      minLength: 10
      description: 初始口令（10–128 位，至少 3 类字符；新建账号首次登录须修改）。明文仅请求期接收，bcrypt 落库
    roles:
      type: array
      items: { type: string }
      default: [user]
      description: 角色名列表（内置/自定义，权限取并集）

UserUpdate:
  type: object
  description: PATCH 语义全部可选；password 提供即重置
  properties:
    displayName:
      type: string
      maxLength: 64
    password:
      type: string
      maxLength: 128
      minLength: 8
    roles:
      type: array
      items: { type: string }
    enabled:
      type: boolean