name: ipam

services:
  # 一次性初始化共享卷权限（ch-exports 默认 root，control-plane 以 10001 运行）
  volume-init:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /exports/backups /vector-config && chown 10001:10001 /exports /exports/backups /vector-config && chmod 750 /exports && chmod 755 /vector-config"]
    volumes:
      - ch-exports:/exports
      - vector-config:/vector-config
    restart: "no"

  postgresql:
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${IPAM_PG_PORT:-5432}:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ipam}
      POSTGRES_USER: ${POSTGRES_USER:-ipam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../../db/postgresql/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ipam} -d ${POSTGRES_DB:-ipam}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/images/control-plane/Dockerfile
      network: host
      args:
        APT_MIRROR: "${APT_MIRROR:-}"
        GO_DL: "${GO_DL:-https://go.dev}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: ipam/control-plane:${IPAM_VERSION:-0.1.0-dev}
    group_add:
      - "${HOST_GID:-1000}"  # 渲染产物目录（config/unbound）组写；与宿主目录属组一致
      - "${UNBOUND_GID:-999}"  # unbound-ctl.sock 组（unbound 容器用户 gid）；M3-009
    depends_on:
      postgresql:
        condition: service_healthy
      clickhouse:
        condition: service_started
      volume-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8443/healthz >/dev/null"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 10s
    environment:
      IPAM_DB_DSN: "postgres://${POSTGRES_USER:-ipam}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB:-ipam}?sslmode=disable"
      IPAM_CH_ADDR: "clickhouse:9000"
      IPAM_CH_DB: ${CLICKHOUSE_DB:-ipam}
      IPAM_CH_USER: ${CLICKHOUSE_USER:-ipam}
      IPAM_CH_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      IPAM_KEA_API: "http://kea-ctrl-agent:8000"
      IPAM_KEA4_IFACE: ${IPAM_KEA4_IFACE:-ens160}  # DHCPv4 数据面接口（hostNetwork 下为宿主网卡名；config-set 渲染读取）
      IPAM_KEA6_IFACE: ${IPAM_KEA6_IFACE:-ens160}  # DHCPv6 数据面接口（hostNetwork 下为宿主网卡名）
      IPAM_KEA6_UNICAST: ${IPAM_KEA6_UNICAST:-}  # 中继单播目标全局地址；kea 以 接口/地址 形式绑定
      IPAM_MIGRATIONS_DIR: "/srv/migrations"
      IPAM_UNBOUND_CONF: "/etc/unbound-ctl/unbound.conf"
      IPAM_LOG_EXPORT_DIR: "/srv/log-exports"
      # 备份与恢复（M6-002）：复用 ch-exports 卷（control-plane 已有写权限）
      IPAM_BACKUP_DIR: "/srv/log-exports/backups"
      IPAM_BACKUP_CONFIG_DIRS: "/etc/unbound-ctl"
      # 日志外发/采样（M6-008）：模板只读，生成配置写入共享卷供 Vector 热加载
      IPAM_VECTOR_TEMPLATE: "/etc/vector-template/vector.toml"
      IPAM_VECTOR_CONFIG: "/etc/vector-config/vector.toml"
      # License（M6-004）：离线授权文件 + Ed25519 公钥（base64/PEM）
      IPAM_LICENSE_FILE: "/srv/log-exports/license.json"
      IPAM_LICENSE_PUBKEY: "${IPAM_LICENSE_PUBKEY:-}"
      # 宿主资源采集（仪表盘「主机资源」卡片）：容器经只读挂载读取宿主 /proc、/sys 与文件系统
      IPAM_HOST_PROC: "/host/proc"
      IPAM_HOST_SYS: "/host/sys"
      IPAM_HOST_ROOT: "/host/root"
      # M6-001：TLS 与密钥（由 install.sh 生成；路径为空=开发态 HTTP）
      IPAM_TLS_CERT: "${IPAM_TLS_CERT:-}"
      IPAM_TLS_KEY: "${IPAM_TLS_KEY:-}"
      IPAM_JWT_SECRET: "${IPAM_JWT_SECRET:?set IPAM_JWT_SECRET in .env (install.sh 会自动生成)}"
      IPAM_RATE_LIMIT: "${IPAM_RATE_LIMIT:-600}"
      # 首次启动的一次性 admin 口令写入该目录（0600）
      IPAM_RUN_DIR: "/run/ipam"
    volumes:
      - ipam-run:/run/ipam
      - ../../db/postgresql/migrations:/srv/migrations:ro
      - ../../config/unbound:/etc/unbound-ctl:ro
      - ../../config/unbound:/etc/unbound-rendered
      - ch-exports:/srv/log-exports
      - vector-config:/etc/vector-config
      - ../../config/vector:/etc/vector-template:ro
      - ${IPAM_CERTS_DIR:-./certs}:/certs:ro
      # 宿主只读挂载（宿主整机 CPU/内存/磁盘；默认递归绑定含数据盘挂载点）
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    ports:
      - "${IPAM_PORT:-8443}:8443"
    restart: unless-stopped

  coherence-daemon:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: ../..
      dockerfile: deploy/images/coherence-daemon/Dockerfile
      args: { APT_MIRROR: "${APT_MIRROR:-}" }
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: ipam/coherence-daemon:${IPAM_VERSION:-0.1.0-dev}
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ipam-run:/run/ipam
    command:
      - "--sock"
      - "/run/ipam/coherence.sock"
      - "--dsn"
      - "postgres://${POSTGRES_USER:-ipam}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB:-ipam}?sslmode=disable"
    restart: unless-stopped

  clickhouse:
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "127.0.0.1:${IPAM_CH_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ipam}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ipam}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - ch-data:/var/lib/clickhouse
      - ../../db/clickhouse/logs.sql:/docker-entrypoint-initdb.d/01_logs.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    restart: unless-stopped

  vector:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: ghcr.io/vectordotdev/vector:0.46.1-alpine
    command: ["--config", "/etc/vector/vector.toml", "--watch-config", "--verbose"]
    environment:
      VECTOR_LOG: "debug"
    depends_on:
      clickhouse:
        condition: service_started
      kea-dhcp4:
        condition: service_started
      control-plane:
        condition: service_started
    volumes:
      - vector-config:/etc/vector
      - kea-logs:/var/log/kea:ro
      - unbound-logs:/var/log/unbound:ro
    restart: unless-stopped

  unbound:
    build:
      context: ../..
      dockerfile: deploy/images/unbound/Dockerfile
      args: { APT_MIRROR: "${APT_MIRROR:-}" }
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: ipam/unbound:${IPAM_VERSION:-0.1.0-dev}
    # hostNetwork：DNS 服务必须看到客户端真实源 IP。桥接网络为纯 IPv4，
    # 客户端经 IPv6（如 2406::ff3）查询时 docker-proxy 会把源 NAT 成网桥网关
    # （172.18.0.1），日志来源与按源限速/ACL 全部失真——与 kea-dhcp6 同理。
    network_mode: host
    depends_on:
      coherence-daemon:
        condition: service_started
    volumes:
      - ipam-run:/run/ipam
      - ../../config/unbound:/etc/unbound:ro
      - ../../config/unbound:/etc/unbound-rendered:ro
      - unbound-logs:/var/log/unbound
    restart: unless-stopped

  kea-dhcp4:
    build:
      context: ../..
      dockerfile: deploy/images/kea/Dockerfile
      args: { COMPONENT: kea-dhcp4-server }
    command: ["sh", "-c", "rm -f /run/ipam/kea4-ctrl.sock; mkdir -p /var/log/kea && exec kea-dhcp4 -c /etc/kea/kea-dhcp4.conf"]
    # hostNetwork：与 kea-dhcp6/unbound 统一。桥接下客户端/中继经宿主 10.61.40.50:67 单播
    # 到达时由 docker-proxy 转发，源地址被 NAT 成网桥网关；hostNetwork 直接绑宿主 :67，
    # 既保留真实源地址，也避免 DHCPv4 广播在桥接网络中的可见性问题。
    network_mode: host
    environment:
      IPAM_KEA4_IFACE: ${IPAM_KEA4_IFACE:-ens160}
    volumes:
      - ../../config/kea/kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro
      - ipam-run:/run/ipam
      - kea-logs:/var/log/kea
      - kea-leases:/var/lib/kea
    restart: unless-stopped

  kea-dhcp6:
    build:
      context: ../..
      dockerfile: deploy/images/kea/Dockerfile
      args: { COMPONENT: kea-dhcp6-server , APT_MIRROR: "${APT_MIRROR:-}" }
    command: ["sh", "-c", "rm -f /run/ipam/kea6-ctrl.sock /run/ipam/kea6-ctrl.sock.lock; mkdir -p /var/log/kea && exec kea-dhcp6 -c /etc/kea/kea-dhcp6.conf"]
    network_mode: host
    environment:
      IPAM_KEA6_IFACE: ${IPAM_KEA6_IFACE:-ens160}
    volumes:
      - ../../config/kea/kea-dhcp6.conf:/etc/kea/kea-dhcp6.conf:ro
      - ipam-run:/run/ipam
      - kea-leases:/var/lib/kea
      - kea-logs:/var/log/kea
    restart: unless-stopped

  kea-ctrl-agent:
    build:
      context: ../..
      dockerfile: deploy/images/kea/Dockerfile
      args: { COMPONENT: kea-ctrl-agent , APT_MIRROR: "${APT_MIRROR:-}" }
    depends_on:
      - kea-dhcp4
      - kea-dhcp6
    command: ["kea-ctrl-agent", "-c", "/etc/kea/kea-ctrl-agent.conf"]
    volumes:
      - ../../config/kea/kea-ctrl-agent.conf:/etc/kea/kea-ctrl-agent.conf:ro
      - ipam-run:/run/ipam
    ports:
      - "127.0.0.1:${KEA_API_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pg-data:
  ipam-run:
  kea-logs:
  kea-leases:
  unbound-logs:
  ch-data:
  ch-exports:
  vector-config:

# unbound 日志经宿主文件（unbound.conf logfile 配置）→ 由 vector file source 读取；
# unbound-logs 卷：unbound 服务读写挂载（root 容器写入），vector 服务只读挂载采集。


