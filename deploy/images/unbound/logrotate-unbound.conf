# unbound 查询日志轮转（M5-032）：daily 兜底 + maxsize 200M 触发上限。
# copytruncate：unbound 全程持有日志 fd（无法低成本重开），原地截断保持
# /var/log/unbound/unbound.log 路径稳定（vector 按路径采集），代价是拷贝窗口
# 内可能丢少量行——查询日志允许。
/var/log/unbound/unbound.log {
    daily
    maxsize 200M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
